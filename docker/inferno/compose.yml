# Inferno Testing Suite for FHIR Compliance Validation
# Official HL7 Inferno framework for testing FHIR implementations
#
# Phase 6: FHIR Validation Plan - docs/fhir-validation-plan.md
#
# Usage:
#   # Start Inferno test suite
#   docker compose -f docker/inferno/compose.yml up -d
#
#   # Access Inferno web UI
#   open http://localhost:4567
#
#   # View logs
#   docker compose -f docker/inferno/compose.yml logs -f
#
# Test Suites Available:
#   - Inferno Core (general FHIR testing)
#   - SMART App Launch v2.0.0 (via ONC Program)
#
# NOTE: IPS and US Core test kits must be run from source.
#       See run-tests.sh --ips or --us-core for instructions.
#
# Reference: https://inferno-framework.github.io/

services:
  # Main Inferno application
  inferno:
    image: infernocommunity/inferno-core:latest
    container_name: vitora-inferno
    ports:
      - "4567:4567"  # Inferno Web UI
    environment:
      # Base configuration
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/inferno
      - EXTERNAL_HOST=http://localhost:4567
      # Session configuration
      - SESSION_SECRET=${INFERNO_SESSION_SECRET:-vitora-inferno-secret-key-change-in-production}
      # Logging
      - LOG_LEVEL=info
    volumes:
      - inferno-data:/opt/inferno/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4567"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - inferno-network

  # PostgreSQL database for Inferno test results
  postgres:
    image: postgres:16-alpine
    container_name: vitora-inferno-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=inferno
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - inferno-network

  # Redis for Inferno session management
  redis:
    image: redis:7-alpine
    container_name: vitora-inferno-redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - inferno-network

  # ONC Inferno Program (includes SMART App Launch tests)
  # This is the official ONC testing tool with multiple test suites
  onc-program:
    image: onchealthit/inferno-program:latest
    container_name: vitora-onc-program
    ports:
      - "4568:4567"  # ONC Program tests (internal port is 4567)
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=onc_program
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - onc  # Only starts with: docker compose --profile onc up
    restart: unless-stopped
    networks:
      - inferno-network

volumes:
  inferno-data:
    name: vitora-inferno-data
  postgres-data:
    name: vitora-inferno-postgres
  redis-data:
    name: vitora-inferno-redis

networks:
  inferno-network:
    name: vitora-inferno-network
    driver: bridge
