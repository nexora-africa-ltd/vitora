# =============================================================================
# Vitora HMIS - Render Blueprint
# =============================================================================
# Deploy with: "New Blueprint Instance" in Render Dashboard
# Or connect this repo and Render will auto-detect this file
# =============================================================================

services:
  # ===========================================================================
  # Backend API (Django)
  # ===========================================================================
  - type: web
    name: vitora
    runtime: python
    region: frankfurt  # or oregon, singapore, ohio
    plan: free  # free, starter, standard, pro
    rootDir: backend
    buildCommand: |
      pip install poetry &&
      poetry config virtualenvs.create false &&
      poetry install --only main --no-interaction &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput
    startCommand: gunicorn hmis.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: vitora.onrender.com,localhost
      - key: CORS_ALLOWED_ORIGINS
        value: https://vitora-hmis.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://vitora.onrender.com,https://vitora-hmis.onrender.com
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: SHA_ENABLED
        value: "true"
      - key: SHA_API_BASE_URL
        value: https://uat.dha.go.ke
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      - key: ICD11_USE_LOCAL
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: vitora-db
          property: connectionString

  # ===========================================================================
  # Frontend (Next.js)
  # ===========================================================================
  - type: web
    name: vitora-hmis
    runtime: node
    region: frankfurt
    plan: free
    rootDir: web-app
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://vitora.onrender.com
      - key: NEXT_PUBLIC_APP_NAME
        value: Vitora HMIS
      - key: NEXT_PUBLIC_ENV
        value: staging
      - key: NODE_ENV
        value: production

# =============================================================================
# Database
# =============================================================================
databases:
  - name: vitora-db
    plan: free  # free (90 days), starter, standard, pro
    region: frankfurt
    databaseName: vitora_hmis
    user: vitora_user
    # ipAllowList: []  # Restrict access if needed
