# =============================================================================
# Vitora HMIS - Render Blueprint (Free Tier)
# =============================================================================
# Deploy with: "New Blueprint Instance" in Render Dashboard
# Or connect this repo and Render will auto-detect this file
#
# URLs:
#   - Frontend: https://vitora.onrender.com
#   - Backend:  https://vitora-api.onrender.com
#
# NOTE: WHO ICD-11 Docker service removed - requires >512MB RAM (free tier limit)
# ICD-11 lookups use DHA Terminology API with fallback to local ICD-10 codes
# =============================================================================

services:
  # ===========================================================================
  # Backend API (Django) - vitora-api.onrender.com
  # ===========================================================================
  - type: web
    name: vitora-api
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    # Build command supports SKIP_FULL_SEED=true to update without resetting demo data
    # Set SKIP_FULL_SEED=true in Render dashboard to only run migrations
    buildCommand: |
      pip install poetry &&
      poetry config virtualenvs.create false &&
      poetry install --only main --no-interaction &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput &&
      if [ "${SKIP_FULL_SEED:-false}" = "true" ]; then
        echo "SKIP_FULL_SEED=true: Skipping full data seed, only running migrations"
      else
        python manage.py import_kenya_locations data/kenya_locations.csv &&
        python manage.py import_icd10 data/icd10_kenya_common.csv &&
        python manage.py import_drugs --file data/drug_catalog.csv &&
        python manage.py load_clinical_templates &&
        python manage.py load_lab_reference_ranges &&
        python manage.py load_default_roles &&
        python manage.py seed_kepi_schedule &&
        echo "from hmis.apps.encounters.models import Encounter; Encounter.objects.filter(status__in=['DRAFT','COMPLETED']).update(status='CREATED')" | python manage.py shell &&
        python manage.py seed_demo_data --force &&
        python manage.py seed_imaging_catalog &&
        python manage.py seed_pharmacy_stock &&
        python manage.py seed_notifiable_diseases &&
        python manage.py seed_surveillance_demo &&
        python manage.py setup_allied_health_permissions &&
        python manage.py seed_allied_health_data &&
        poetry run python manage.py seed_quality_measures &&
        poetry run python manage.py seed_cds_rules &&
        python manage.py seed_allied_health_demo
      fi
    startCommand: daphne -b 0.0.0.0 -p $PORT hmis.asgi:application
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: hmis.settings.staging
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: vitora-api.onrender.com,localhost
      - key: CORS_ALLOWED_ORIGINS
        value: https://vitora.onrender.com,http://localhost:3009
      - key: CSRF_TRUSTED_ORIGINS
        value: https://vitora-api.onrender.com,https://vitora.onrender.com
      - key: ENCRYPTION_KEY
        value: zPvPKpZGcLmqPJ3L2oXZBCH_gJGWl5C6FZp8YMfFgFA=
      - key: SKIP_FULL_SEED
        value: "false"
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_FACILITY_NAME
        value: "Demo Health Facility"
      - key: SHA_ENABLED
        value: "true"
      - key: SHA_API_BASE_URL
        value: https://uat.dha.go.ke
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      - key: ICD11_USE_LOCAL
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: vitora-db
          property: connectionString

  # ===========================================================================
  # Frontend (Next.js) - vitora.onrender.com
  # ===========================================================================
  - type: web
    name: vitora
    runtime: node
    region: frankfurt
    plan: free
    rootDir: web-app
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://vitora-api.onrender.com
      - key: NEXT_PUBLIC_APP_NAME
        value: Vitora HMIS
      - key: NEXT_PUBLIC_ENV
        value: staging
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "true"
      - key: NEXT_PUBLIC_DEMO_FACILITY
        value: "Demo Health Facility"
      - key: NEXT_PUBLIC_ENABLE_BILLING
        value: "true"
      - key: NEXT_PUBLIC_ENABLE_LAB
        value: "true"
      - key: NEXT_PUBLIC_ENABLE_PHARMACY
        value: "true"
      - key: NEXT_PUBLIC_ENABLE_TRIAGE
        value: "true"
      - key: NODE_ENV
        value: production

  # ===========================================================================
  # PRODUCTION SERVICES (COMMENTED OUT - Not using Render for production)
  # ===========================================================================
  # - type: web
  #   name: vitora-prod
  #   runtime: python
  #   # region: omitted to preserve existing service region
  #   plan: free  # free, starter, standard, pro
  #   rootDir: backend
