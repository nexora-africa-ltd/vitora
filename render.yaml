# =============================================================================
# Vitora HMIS - Render Blueprint
# =============================================================================
# Deploy with: "New Blueprint Instance" in Render Dashboard
# Or connect this repo and Render will auto-detect this file
#
# NOTE: WHO ICD-11 Docker service removed - requires >512MB RAM (free tier limit)
# ICD-11 lookups use DHA Terminology API with fallback to local ICD-10 codes
# =============================================================================

services:
  # ===========================================================================
  # Backend API - STAGING (Django)
  # ===========================================================================
  - type: web
    name: vitora-staging
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: |
      pip install poetry &&
      poetry config virtualenvs.create false &&
      poetry install --only main --no-interaction &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput &&
      python manage.py import_kenya_locations data/kenya_locations.csv &&
      python manage.py import_icd10 data/icd10_kenya_common.csv &&
      python manage.py import_drugs --file data/drug_catalog.csv &&
      python manage.py load_clinical_templates &&
      python manage.py load_lab_reference_ranges &&
      python manage.py load_default_roles &&
      python manage.py seed_demo_data --force &&
      python manage.py seed_imaging_catalog
    startCommand: gunicorn hmis.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: hmis.settings.staging
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: vitora-staging.onrender.com,localhost
      - key: CORS_ALLOWED_ORIGINS
        value: https://vitora-hmis-staging.onrender.com,http://localhost:3009
      - key: CSRF_TRUSTED_ORIGINS
        value: https://vitora-staging.onrender.com,https://vitora-hmis-staging.onrender.com
      - key: ENCRYPTION_KEY
        value: zPvPKpZGcLmqPJ3L2oXZBCH_gJGWl5C6FZp8YMfFgFA=
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_FACILITY_NAME
        value: "Demo Health Facility"
      - key: SHA_ENABLED
        value: "true"
      - key: SHA_API_BASE_URL
        value: https://uat.dha.go.ke
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      - key: ICD11_USE_LOCAL
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: vitora-staging-db
          property: connectionString

  # ===========================================================================
  # Frontend - STAGING (Next.js)
  # ===========================================================================
  - type: web
    name: vitora-hmis-staging
    runtime: node
    region: frankfurt
    plan: free
    rootDir: web-app
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://vitora-staging.onrender.com
      - key: NEXT_PUBLIC_APP_NAME
        value: Vitora HMIS
      - key: NEXT_PUBLIC_ENV
        value: staging
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "true"
      - key: NEXT_PUBLIC_DEMO_FACILITY
        value: "Demo Health Facility"
      - key: NEXT_PUBLIC_ENABLE_BILLING
        value: "true"
      - key: NEXT_PUBLIC_ENABLE_LAB
        value: "true"
      - key: NEXT_PUBLIC_ENABLE_PHARMACY
        value: "true"
      - key: NEXT_PUBLIC_ENABLE_TRIAGE
        value: "true"
      - key: NODE_ENV
        value: production

  # ===========================================================================
  # Backend API - PRODUCTION (Django)
  # ===========================================================================
  - type: web
    name: vitora
    runtime: python
    # region: omitted to preserve existing service region
    plan: free  # free, starter, standard, pro
    rootDir: backend
    buildCommand: |
      pip install poetry &&
      poetry config virtualenvs.create false &&
      poetry install --only main --no-interaction &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput
    startCommand: gunicorn hmis.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: hmis.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: vitora.onrender.com,localhost
      - key: CORS_ALLOWED_ORIGINS
        value: https://vitora-hmis.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://vitora.onrender.com,https://vitora-hmis.onrender.com
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: SHA_ENABLED
        value: "true"
      - key: SHA_API_BASE_URL
        value: https://uat.dha.go.ke
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      - key: ICD11_USE_LOCAL
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: vitora-db
          property: connectionString

  # ===========================================================================
  # Frontend - PRODUCTION (Next.js)
  # ===========================================================================
  - type: web
    name: vitora-hmis
    runtime: node
    # region: omitted to preserve existing service region
    plan: free
    rootDir: web-app
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://vitora.onrender.com
      - key: NEXT_PUBLIC_APP_NAME
        value: Vitora HMIS
      - key: NEXT_PUBLIC_ENV
        value: production
      - key: NODE_ENV
        value: production

# =============================================================================
# Databases
# =============================================================================
databases:
  # Staging Database (for demos)
  - name: vitora-staging-db
    plan: free
    region: frankfurt
    databaseName: vitora_staging
    user: vitora_staging_user

  # Production Database
  - name: vitora-db
    plan: free  # free (90 days), starter, standard, pro
    region: frankfurt
    databaseName: vitora_hmis
    user: vitora_user
    # ipAllowList: []  # Restrict access if needed
