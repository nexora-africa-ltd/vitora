name: Build Hub Artifact

# Builds a Cython-compiled, self-contained tarball/zip of the Django backend
# for facility hub deployment. Each .py file becomes a sibling .so (Linux)
# or .pyd (Windows). Uploads to Azure Blob Storage for unauthenticated
# download. Triggered on hub version tags or manually.

on:
  push:
    tags:
      - "hub-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 0.4.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  BLOB_CONTAINER: "releases"
  CDN_BASE_URL: "https://get.vitora.digital"

jobs:
  compile:
    name: Compile Hub (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-22.04
            ext: tar.gz
            shell: bash
          - platform: windows-amd64
            runner: windows-2022
            ext: zip
            shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF_NAME}"
            echo "version=${TAG#hub-v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # --- Linux-only system deps ---
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc python3-dev patchelf ccache

      # --- Windows MSVC is pre-installed on windows-2022 ---

      - name: Install Poetry
        shell: bash
        run: |
          pip install poetry
          poetry self add poetry-plugin-export
          poetry config virtualenvs.create false

      - name: Export requirements
        working-directory: backend
        shell: bash
        run: |
          poetry export --without dev --without-hashes --format requirements.txt --output requirements-hub-raw.txt
          python -c "
          import re
          with open('requirements-hub-raw.txt') as f:
              lines = f.readlines()
          with open('requirements-hub.txt', 'w') as f:
              for line in lines:
                  cleaned = re.sub(r' ; (python_version|platform_system|sys_platform|implementation_name).*', '', line)
                  f.write(cleaned)
          "
          rm -f requirements-hub-raw.txt

      - name: Install Python dependencies (for Cython)
        working-directory: backend
        shell: bash
        run: |
          poetry install --without dev --no-root
          pip install "cython>=3.0" setuptools wheel

      - name: Compile with Cython
        working-directory: backend
        shell: bash
        run: |
          python scripts/compile-hub.py \
            --output-dir build/compiled \
            --version "${{ steps.version.outputs.version }}" \
            --jobs 4

      - name: Sign manifest (Linux only)
        if: runner.os == 'Linux' && env.COSIGN_PRIVATE_KEY != ''
        working-directory: backend
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          COSIGN_VERSION="v2.2.4"
          curl -sLO "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          chmod +x cosign-linux-amd64
          sudo mv cosign-linux-amd64 /usr/local/bin/cosign

          MANIFEST="build/compiled/manifest.json"
          if [[ -f "$MANIFEST" ]]; then
            cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY "$MANIFEST" > "${MANIFEST}.sig"
            echo "Manifest signed: ${MANIFEST}.sig"
          fi

      - name: Package hub artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARTIFACT="vitora-hub-${VERSION}-linux-amd64"
          mkdir -p "dist/${ARTIFACT}"

          cp -r backend/build/compiled/payload/* "dist/${ARTIFACT}/"
          cp -r backend/data "dist/${ARTIFACT}/"
          cp backend/manage.py "dist/${ARTIFACT}/"
          cp backend/requirements-hub.txt "dist/${ARTIFACT}/"
          cp backend/pyproject.toml "dist/${ARTIFACT}/"
          cp backend/build/compiled/manifest.json "dist/${ARTIFACT}/" 2>/dev/null || true
          cp backend/build/compiled/manifest.json.sig "dist/${ARTIFACT}/" 2>/dev/null || true

          mkdir -p "dist/${ARTIFACT}/scripts"
          cp backend/scripts/install-hub.sh "dist/${ARTIFACT}/scripts/"
          cp backend/scripts/update-hub.sh "dist/${ARTIFACT}/scripts/"
          cp backend/scripts/install-hub-windows.ps1 "dist/${ARTIFACT}/scripts/"
          cp backend/scripts/update-hub-windows.ps1 "dist/${ARTIFACT}/scripts/"
          cp backend/scripts/pi-setup.sh "dist/${ARTIFACT}/scripts/"

          mkdir -p "dist/${ARTIFACT}/keys"
          cp backend/keys/license_public.pem "dist/${ARTIFACT}/keys/"

          # Bundle the EULA at the root of the hub install
          cp backend/scripts/HUB-EULA.txt "dist/${ARTIFACT}/EULA.txt"

          echo "$VERSION" > "dist/${ARTIFACT}/VERSION"

          cd dist
          tar -czf "${ARTIFACT}.tar.gz" "${ARTIFACT}"
          sha256sum "${ARTIFACT}.tar.gz" > "${ARTIFACT}.tar.gz.sha256"

          echo "artifact_path=dist/${ARTIFACT}.tar.gz" >> "$GITHUB_ENV"

      - name: Package hub artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VERSION = "${{ steps.version.outputs.version }}"
          $ARTIFACT = "vitora-hub-${VERSION}-windows-amd64"
          New-Item -ItemType Directory -Force -Path "dist\${ARTIFACT}"

          Copy-Item -Recurse "backend\build\compiled\payload\*" "dist\${ARTIFACT}\"
          Copy-Item -Recurse "backend\data" "dist\${ARTIFACT}\data"
          Copy-Item "backend\manage.py" "dist\${ARTIFACT}\"
          Copy-Item "backend\requirements-hub.txt" "dist\${ARTIFACT}\"
          Copy-Item "backend\pyproject.toml" "dist\${ARTIFACT}\"
          if (Test-Path "backend\build\compiled\manifest.json") {
            Copy-Item "backend\build\compiled\manifest.json" "dist\${ARTIFACT}\"
          }

          New-Item -ItemType Directory -Force -Path "dist\${ARTIFACT}\scripts"
          Copy-Item "backend\scripts\install-hub-windows.ps1" "dist\${ARTIFACT}\scripts\"
          Copy-Item "backend\scripts\update-hub-windows.ps1" "dist\${ARTIFACT}\scripts\"
          Copy-Item "backend\scripts\install-hub.sh" "dist\${ARTIFACT}\scripts\"
          Copy-Item "backend\scripts\update-hub.sh" "dist\${ARTIFACT}\scripts\"
          Copy-Item "backend\scripts\pi-setup.sh" "dist\${ARTIFACT}\scripts\"

          New-Item -ItemType Directory -Force -Path "dist\${ARTIFACT}\keys"
          Copy-Item "backend\keys\license_public.pem" "dist\${ARTIFACT}\keys\"

          # Bundle the EULA at the root of the hub install
          Copy-Item "backend\scripts\HUB-EULA.txt" "dist\${ARTIFACT}\EULA.txt"

          Set-Content -Path "dist\${ARTIFACT}\VERSION" -Value $VERSION

          Compress-Archive -Path "dist\${ARTIFACT}" -DestinationPath "dist\${ARTIFACT}.zip"
          $hash = (Get-FileHash "dist\${ARTIFACT}.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "dist\${ARTIFACT}.zip.sha256" -Value "${hash}  ${ARTIFACT}.zip"

          echo "artifact_zip_path=dist\${ARTIFACT}.zip" >> $env:GITHUB_ENV

      - name: Upload build artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: hub-linux-amd64
          path: |
            dist/vitora-hub-*-linux-amd64.tar.gz
            dist/vitora-hub-*-linux-amd64.tar.gz.sha256

      - name: Upload build artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: hub-windows-amd64
          path: |
            dist/vitora-hub-*-windows-amd64.zip
            dist/vitora-hub-*-windows-amd64.zip.sha256

  smoke-test:
    name: Smoke Test Compiled Hub (Linux)
    needs: compile
    runs-on: ubuntu-22.04

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: hub-linux-amd64
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract and verify
        run: |
          mkdir hub && cd hub
          tar -xzf ../dist/*.tar.gz --strip-components=1

          # Verify .so files exist (compilation succeeded)
          SO_COUNT=$(find . -name "*.so" | wc -l)
          echo "Compiled .so modules: $SO_COUNT"

          if [[ "$SO_COUNT" -lt 100 ]]; then
            echo "ERROR: Expected at least 100 .so modules, found $SO_COUNT — Cython build likely failed."
            exit 1
          fi

          # Verify the encounters/signals fix landed (was the v0.4.1 bug)
          if ! ls hmis/apps/encounters/signals.*.so >/dev/null 2>&1; then
            echo "ERROR: hmis/apps/encounters/signals.*.so missing — this was the v0.4.1 install bug"
            exit 1
          fi
          echo "encounters/signals compiled correctly: $(ls hmis/apps/encounters/signals.*.so)"

          # Sanity: management commands kept as .py (Django needs to scan dirs)
          MGMT_PY=$(find hmis/apps/ -path "*/management/commands/*.py" ! -name "__init__.py" | wc -l)
          echo "Management command .py files (must be >0): $MGMT_PY"
          if [[ "$MGMT_PY" -eq 0 ]]; then
            echo "ERROR: No management commands as plain .py — Django can't discover them"
            exit 1
          fi

          # Sanity: migrations kept as .py
          MIG_PY=$(find hmis/apps/ -path "*/migrations/*.py" ! -name "__init__.py" | wc -l)
          echo "Migration .py files (must be >0): $MIG_PY"
          if [[ "$MIG_PY" -eq 0 ]]; then
            echo "ERROR: No migrations as plain .py — Django can't apply them"
            exit 1
          fi

          # Verify manage.py exists
          if [[ ! -f manage.py ]]; then
            echo "ERROR: manage.py not found!"
            exit 1
          fi

          # Verify EULA bundled
          if [[ ! -f EULA.txt ]]; then
            echo "ERROR: EULA.txt not bundled!"
            exit 1
          fi

          # Verify data directory exists (reference data for seeding)
          if [[ ! -d data ]] || [[ ! -f data/kenya_locations.csv ]]; then
            echo "ERROR: data/kenya_locations.csv not found!"
            exit 1
          fi

          echo "Smoke test PASSED"

      - name: Import test (Django boots with compiled modules)
        working-directory: hub
        run: |
          # Install runtime deps and try to bring up Django.
          # This catches Cython binary-incompatibility issues that the simple
          # file-count check above would miss.
          pip install -r requirements-hub.txt
          export DJANGO_SETTINGS_MODULE=hmis.settings.hub
          export HUB_DATA_DIR=$(pwd)
          export ENCRYPTION_KEY=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          python -c "
          import django
          django.setup()
          from hmis.apps.encounters import signals
          from hmis.apps.patients import models
          assert signals.__file__.endswith('.so'), f'signals not compiled: {signals.__file__}'
          print('IMPORT OK:', signals.__file__)
          print('IMPORT OK:', models.Patient)
          "

  smoke-test-windows:
    name: Smoke Test Compiled Hub (Windows)
    needs: compile
    runs-on: windows-2022

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: hub-windows-amd64
          path: dist/

      - name: Set up Python 3.12 (MUST match build ABI)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract and verify
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path hub | Out-Null
          $zip = Get-ChildItem dist\*.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath hub
          # Zip has a single top-level dir - flatten it.
          $inner = Get-ChildItem hub | Where-Object { $_.PSIsContainer } | Select-Object -First 1
          Get-ChildItem $inner.FullName -Force | Move-Item -Destination hub
          Remove-Item -Recurse -Force $inner.FullName

          $pydCount = (Get-ChildItem hub -Recurse -Filter "*.pyd").Count
          Write-Host "Compiled .pyd modules: $pydCount"
          if ($pydCount -lt 100) {
            Write-Error "Expected at least 100 .pyd modules, found $pydCount — Cython build likely failed."
            exit 1
          }

          $signalsPyd = Get-ChildItem hub\hmis\apps\encounters\signals.*.pyd -ErrorAction SilentlyContinue
          if (-not $signalsPyd) {
            Write-Error "hmis\apps\encounters\signals.*.pyd missing — the install would fail with 'cannot import name signals'"
            Write-Host "Files actually in hub\hmis\apps\encounters:"
            Get-ChildItem hub\hmis\apps\encounters | Format-Table Name, Length
            exit 1
          }
          Write-Host "encounters\signals compiled: $($signalsPyd.Name)"

          # Verify all .pyd files use cp312 ABI tag (must match what installer enforces).
          $wrongAbi = Get-ChildItem hub -Recurse -Filter "*.pyd" |
            Where-Object { $_.Name -notmatch '\.cp312-' }
          if ($wrongAbi) {
            Write-Error "Found .pyd files with wrong ABI tag (expected cp312):"
            $wrongAbi | Select-Object -First 10 FullName | Format-Table
            exit 1
          }

          Write-Host "Windows smoke test PASSED"

      - name: Import test (Django boots with compiled .pyd modules)
        shell: pwsh
        working-directory: hub
        run: |
          # Install runtime deps and bring up Django. This catches DLL-load
          # failures, missing-MSVC-runtime errors, and ABI mismatches that
          # silently degrade to 'cannot import name X' at runtime.
          pip install -r requirements-hub.txt
          if ($LASTEXITCODE -ne 0) { Write-Error "pip install failed"; exit $LASTEXITCODE }

          $env:DJANGO_SETTINGS_MODULE = "hmis.settings.hub"
          $env:HUB_DATA_DIR = $PWD.Path
          $env:ENCRYPTION_KEY = (python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          Write-Host "ENCRYPTION_KEY length: $($env:ENCRYPTION_KEY.Length)"

          # Build the import test script line-by-line — PowerShell here-strings
          # inside a YAML | block are fragile (the closing '@ must be at column 0
          # which depends on YAML de-indentation rules).
          $lines = @(
            'import sys',
            'print("python:", sys.version)',
            'print("executable:", sys.executable)',
            'import importlib.machinery',
            'print("EXTENSION_SUFFIXES:", importlib.machinery.EXTENSION_SUFFIXES)',
            'import django',
            'django.setup()',
            'from hmis.apps.encounters import signals',
            'from hmis.apps.patients import models',
            'assert signals.__file__.endswith(".pyd"), f"signals not compiled: {signals.__file__}"',
            'print("IMPORT OK signals:", signals.__file__)',
            'print("IMPORT OK Patient:", models.Patient)'
          )
          Set-Content -Path import_test.py -Value $lines -Encoding UTF8

          Write-Host "--- import_test.py ---"
          Get-Content import_test.py
          Write-Host "--- running ---"

          python import_test.py
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Import test failed with exit $LASTEXITCODE"
            exit $LASTEXITCODE
          }

  publish:
    name: Publish Hub Artifacts
    needs: [smoke-test, smoke-test-windows]
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout (for installer scripts)
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Determine version
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF_NAME}"
            echo "version=${TAG#hub-v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Azure Blob Storage
        if: env.AZURE_STORAGE_CONNECTION_STRING != ''
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # --- Linux amd64 tarball ---
          TARBALL="artifacts/hub-linux-amd64/vitora-hub-${VERSION}-linux-amd64.tar.gz"

          az storage blob upload \
            --container-name "$BLOB_CONTAINER" \
            --name "hub/vitora-hub-${VERSION}.tar.gz" \
            --file "$TARBALL" \
            --overwrite \
            --content-type application/gzip

          az storage blob upload \
            --container-name "$BLOB_CONTAINER" \
            --name "hub/vitora-hub-${VERSION}.tar.gz.sha256" \
            --file "${TARBALL}.sha256" \
            --overwrite \
            --content-type text/plain

          az storage blob upload \
            --container-name "$BLOB_CONTAINER" \
            --name "hub/vitora-hub-latest.tar.gz" \
            --file "$TARBALL" \
            --overwrite \
            --content-type application/gzip

          # --- Windows amd64 zip (natively compiled .pyd) ---
          WIN_ZIP="artifacts/hub-windows-amd64/vitora-hub-${VERSION}-windows-amd64.zip"

          az storage blob upload \
            --container-name "$BLOB_CONTAINER" \
            --name "hub/vitora-hub-${VERSION}.zip" \
            --file "$WIN_ZIP" \
            --overwrite \
            --content-type application/zip

          az storage blob upload \
            --container-name "$BLOB_CONTAINER" \
            --name "hub/vitora-hub-${VERSION}.zip.sha256" \
            --file "${WIN_ZIP}.sha256" \
            --overwrite \
            --content-type text/plain

          az storage blob upload \
            --container-name "$BLOB_CONTAINER" \
            --name "hub/vitora-hub-latest.zip" \
            --file "$WIN_ZIP" \
            --overwrite \
            --content-type application/zip

          # --- latest.json manifest ---
          TARBALL_SHA=$(cat "${TARBALL}.sha256" | awk '{print $1}')
          WIN_ZIP_SHA=$(cat "${WIN_ZIP}.sha256" | awk '{print $1}')
          python3 -c "
          import json
          manifest = {
              'version': '${VERSION}',
              'url': '${CDN_BASE_URL}/hub/vitora-hub-${VERSION}.tar.gz',
              'url_zip': '${CDN_BASE_URL}/hub/vitora-hub-${VERSION}.zip',
              'sha256': '${TARBALL_SHA}',
              'sha256_zip': '${WIN_ZIP_SHA}'
          }
          with open('/tmp/hub-latest.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          "

          az storage blob upload \
            --container-name "$BLOB_CONTAINER" \
            --name "hub/latest.json" \
            --file /tmp/hub-latest.json \
            --overwrite \
            --content-type application/json \
            --content-cache-control "max-age=300"

          # --- Installer scripts ---
          az storage blob upload \
            --container-name "$BLOB_CONTAINER" \
            --name "hub" \
            --file backend/scripts/install-hub.sh \
            --overwrite \
            --content-type "text/x-shellscript" \
            --content-cache-control "max-age=600"

          az storage blob upload \
            --container-name "$BLOB_CONTAINER" \
            --name "hub.ps1" \
            --file backend/scripts/bootstrap-hub-windows.ps1 \
            --overwrite \
            --content-type "text/plain" \
            --content-cache-control "max-age=600"

          # The real installer. Downloaded by hub.ps1 to a temp file and
          # run as a child process so `exit N` in the installer cannot
          # terminate the user's PowerShell host when invoked via
          # `irm https://get.vitora.digital/hub.ps1 | iex`.
          az storage blob upload \
            --container-name "$BLOB_CONTAINER" \
            --name "install-hub-windows.ps1" \
            --file backend/scripts/install-hub-windows.ps1 \
            --overwrite \
            --content-type "text/plain" \
            --content-cache-control "max-age=600"

          az storage blob upload \
            --container-name "$BLOB_CONTAINER" \
            --name "hub-update.ps1" \
            --file backend/scripts/update-hub-windows.ps1 \
            --overwrite \
            --content-type "text/plain" \
            --content-cache-control "max-age=600"

          az storage blob upload \
            --container-name "$BLOB_CONTAINER" \
            --name "pi-setup" \
            --file backend/scripts/pi-setup.sh \
            --overwrite \
            --content-type "text/x-shellscript" \
            --content-cache-control "max-age=600"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/hub-v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          name: "Vitora Hub v${{ steps.version.outputs.version }}"
          body: |
            ## Vitora HMIS — Facility Hub v${{ steps.version.outputs.version }}

            ### Install (new facility)

            **Linux / Raspberry Pi:**
            ```bash
            curl -sSL https://get.vitora.digital/hub | sudo bash
            ```

            **Windows (PowerShell as Admin):**
            ```powershell
            irm https://get.vitora.digital/hub.ps1 | iex
            ```

            ### Update (existing hub)

            **Linux:**
            ```bash
            sudo bash /opt/vitora/scripts/update-hub.sh
            ```

            **Windows (PowerShell as Admin):**
            ```powershell
            powershell -ExecutionPolicy Bypass -File C:\VitoraHub\scripts\update-hub-windows.ps1
            ```

            ### Artifacts

            | Platform | File |
            |----------|------|
            | Linux x86_64 | `vitora-hub-${{ steps.version.outputs.version }}-linux-amd64.tar.gz` |
            | Windows x64 | `vitora-hub-${{ steps.version.outputs.version }}-windows-amd64.zip` |

            ### Requirements

            | Platform | Requirements |
            |----------|-------------|
            | Linux | Ubuntu 22.04+ / Debian 12+ / Raspberry Pi OS, Python 3.11+, 2GB+ RAM |
            | Windows | Windows 10/11 / Server 2019+, Python 3.11+ on PATH, 4GB+ RAM |

            ### Integrity
            All files are Nuitka-compiled (no readable Python source). Each artifact
            includes `manifest.json` with SHA-256 hashes of all files.
          files: |
            artifacts/hub-linux-amd64/*.tar.gz
            artifacts/hub-linux-amd64/*.sha256
            artifacts/hub-windows-amd64/*.zip
            artifacts/hub-windows-amd64/*.sha256
          fail_on_unmatched_files: false
