name: Daily Database Backup

on:
  schedule:
    # Run daily at 02:00 UTC (05:00 EAT)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production

env:
  AZURE_RESOURCE_GROUP: vitora-rg-sa
  STORAGE_ACCOUNT: vitorabackupssa
  STORAGE_CONTAINER: db-backups
  BACKUP_JOB_NAME: vitora-db-backup-prod-sa

jobs:
  backup:
    name: Backup ${{ github.event.inputs.environment || 'production' }} database
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    permissions:
      id-token: write
      contents: read

    env:
      CONTAINER_APP_NAME: ${{ (github.event.inputs.environment == 'staging') && 'vitora-api-private-sa' || 'vitora-api-prod-private-sa' }}

    steps:
      - name: Log in to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_SA_CLIENT_ID != '' && secrets.AZURE_SA_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_SA_TENANT_ID != '' && secrets.AZURE_SA_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SA_SUBSCRIPTION_ID != '' && secrets.AZURE_SA_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure storage container exists
        run: |
          STORAGE_KEY="${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}"
          if [[ -z "$STORAGE_KEY" ]]; then
            STORAGE_KEY=$(az storage account keys list \
              --account-name ${{ env.STORAGE_ACCOUNT }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --query '[0].value' \
              --output tsv)
          fi
          az storage container create \
            --account-name ${{ env.STORAGE_ACCOUNT }} \
            --name ${{ env.STORAGE_CONTAINER }} \
            --account-key "$STORAGE_KEY" \
            --public-access off \
            --output none

      - name: Generate SAS token (24h write)
        id: sas
        run: |
          EXPIRY=$(date -u -d "+24 hours" +"%Y-%m-%dT%H:%MZ")
          STORAGE_KEY="${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}"
          if [[ -z "$STORAGE_KEY" ]]; then
            STORAGE_KEY=$(az storage account keys list \
              --account-name ${{ env.STORAGE_ACCOUNT }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --query '[0].value' \
              --output tsv)
          fi
          SAS=$(az storage container generate-sas \
            --account-name ${{ env.STORAGE_ACCOUNT }} \
            --name ${{ env.STORAGE_CONTAINER }} \
            --permissions rcwdl \
            --expiry "$EXPIRY" \
            --account-key "$STORAGE_KEY" \
            -o tsv)

          if [[ -z "$SAS" ]]; then
            echo "ERROR: Failed to generate SAS token."
            echo "Provide AZURE_STORAGE_ACCOUNT_KEY secret or grant Blob Data role to OIDC principal."
            exit 1
          fi

          echo "::add-mask::$SAS"
          echo "token=$SAS" >> "$GITHUB_OUTPUT"

      - name: Prepare unique backup artifact
        id: backup_context
        run: |
          BACKUP_ENV="${{ github.event.inputs.environment || 'production' }}"
          RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          TIMESTAMP=$(date -u +"%Y-%m-%d_%H%M%S")
          STARTED_EPOCH=$(date -u +%s)

          echo "environment=$BACKUP_ENV" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "started_epoch=$STARTED_EPOCH" >> "$GITHUB_OUTPUT"

      - name: Run dedicated backup job
        id: run_backup
        run: |
          JOB_IMAGE=$(az containerapp job show \
            --name "${{ env.BACKUP_JOB_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "properties.template.containers[0].image" \
            --output tsv)
          EXECUTION_NAME=$(az containerapp job start \
            --name "${{ env.BACKUP_JOB_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --image "$JOB_IMAGE" \
            --command bash /app/scripts/backup-db.sh \
            --cpu 1.0 \
            --memory 2Gi \
            --env-vars \
              "DATABASE_URL=secretref:database-url" \
              "AZURE_STORAGE_ACCOUNT=${{ env.STORAGE_ACCOUNT }}" \
              "AZURE_STORAGE_CONTAINER=${{ env.STORAGE_CONTAINER }}" \
              "VITORA_ENV=production" \
              "PGAPPNAME=vitora-production-backup-job" \
              "VITORA_BACKUP_TIMESTAMP=${{ steps.backup_context.outputs.timestamp }}" \
              "VITORA_BACKUP_RUN_ID=${{ steps.backup_context.outputs.run_id }}" \
            --query name \
            --output tsv)
          if [[ -z "$EXECUTION_NAME" ]]; then
            echo "ERROR: Backup Job did not return an execution name."
            exit 1
          fi

          echo "Started backup Job execution: $EXECUTION_NAME"
          for _ in $(seq 1 240); do
            STATUS=$(az containerapp job execution show \
              --name "${{ env.BACKUP_JOB_NAME }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --job-execution-name "$EXECUTION_NAME" \
              --query properties.status \
              --output tsv 2>/dev/null || true)
            case "$STATUS" in
              Succeeded) break ;;
              Failed|Canceled)
                az containerapp job execution show \
                  --name "${{ env.BACKUP_JOB_NAME }}" \
                  --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
                  --job-execution-name "$EXECUTION_NAME" \
                  --output json
                echo "ERROR: Backup Job execution finished with status $STATUS."
                exit 1
                ;;
            esac
            sleep 15
          done

          if [[ "$STATUS" != "Succeeded" ]]; then
            echo "ERROR: Timed out waiting for backup Job execution $EXECUTION_NAME."
            exit 1
          fi

          echo "artifact=vitora-${{ steps.backup_context.outputs.environment }}-${{ steps.backup_context.outputs.timestamp }}-${{ steps.backup_context.outputs.run_id }}.sql.gz" >> "$GITHUB_OUTPUT"

      - name: Prune old backups (30-day retention)
        run: |
          CUTOFF=$(date -u -d "-30 days" +"%Y-%m-%dT%H:%M:%SZ")
          OLD_BLOBS=$(az storage blob list \
            --account-name ${{ env.STORAGE_ACCOUNT }} \
            --container-name ${{ env.STORAGE_CONTAINER }} \
            --sas-token "${{ steps.sas.outputs.token }}" \
            --query "[?properties.creationTime < '${CUTOFF}'].name" \
            -o tsv 2>/dev/null || true)

          DELETED=0
          for blob in $OLD_BLOBS; do
            az storage blob delete \
              --account-name ${{ env.STORAGE_ACCOUNT }} \
              --container-name ${{ env.STORAGE_CONTAINER }} \
              --name "$blob" \
              --sas-token "${{ steps.sas.outputs.token }}" && ((DELETED++)) || true
          done
          echo "Pruned ${DELETED} backup(s) older than 30 days"

      - name: Verify this run's backup artifact
        run: |
          ARTIFACT="${{ steps.run_backup.outputs.artifact }}"
          CREATED_AT=$(az storage blob show \
            --account-name ${{ env.STORAGE_ACCOUNT }} \
            --container-name ${{ env.STORAGE_CONTAINER }} \
            --name "$ARTIFACT" \
            --sas-token "${{ steps.sas.outputs.token }}" \
            --query "properties.creationTime" \
            -o tsv)

          if [[ -z "$CREATED_AT" ]]; then
            echo "ERROR: Expected backup artifact '$ARTIFACT' was not found."
            exit 1
          fi

          CREATED_EPOCH=$(date -u -d "$CREATED_AT" +%s)
          if [[ "$CREATED_EPOCH" -lt "${{ steps.backup_context.outputs.started_epoch }}" ]]; then
            echo "ERROR: Backup artifact '$ARTIFACT' predates this workflow run."
            exit 1
          fi

          SIZE_BYTES=$(az storage blob show \
            --account-name ${{ env.STORAGE_ACCOUNT }} \
            --container-name ${{ env.STORAGE_CONTAINER }} \
            --name "$ARTIFACT" \
            --sas-token "${{ steps.sas.outputs.token }}" \
            --query "properties.contentLength" \
            -o tsv)
          if ! [[ "$SIZE_BYTES" =~ ^[0-9]+$ ]] || [[ "$SIZE_BYTES" -lt 1024 ]]; then
            echo "ERROR: Backup artifact '$ARTIFACT' is missing or too small ($SIZE_BYTES bytes)."
            exit 1
          fi

          az storage blob show \
            --account-name ${{ env.STORAGE_ACCOUNT }} \
            --container-name ${{ env.STORAGE_CONTAINER }} \
            --name "$ARTIFACT" \
            --sas-token "${{ steps.sas.outputs.token }}" \
            --query "{name:name,size:properties.contentLength,created:properties.creationTime}" \
            -o table
