name: Daily Database Backup

on:
  schedule:
    # Run daily at 02:00 UTC (05:00 EAT)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  AZURE_RESOURCE_GROUP: vitora-rg-sa
  STORAGE_ACCOUNT: vitorabackupssa
  STORAGE_CONTAINER: db-backups

jobs:
  backup:
    name: Backup ${{ github.event.inputs.environment || 'production' }} database
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    permissions:
      id-token: write
      contents: read

    env:
      CONTAINER_APP_NAME: ${{ (github.event.inputs.environment == 'staging') && 'vitora-api-private-sa' || 'vitora-api-prod-private-sa' }}

    steps:
      - name: Log in to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_SA_CLIENT_ID != '' && secrets.AZURE_SA_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_SA_TENANT_ID != '' && secrets.AZURE_SA_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SA_SUBSCRIPTION_ID != '' && secrets.AZURE_SA_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure storage container exists
        run: |
          STORAGE_KEY="${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}"

          if [[ -n "$STORAGE_KEY" ]]; then
            az storage container create \
              --account-name ${{ env.STORAGE_ACCOUNT }} \
              --name ${{ env.STORAGE_CONTAINER }} \
              --account-key "$STORAGE_KEY" \
              --public-access off \
              --output none
          else
            az storage container create \
              --account-name ${{ env.STORAGE_ACCOUNT }} \
              --name ${{ env.STORAGE_CONTAINER }} \
              --auth-mode login \
              --public-access off \
              --output none
          fi

      - name: Generate SAS token (24h write)
        id: sas
        run: |
          EXPIRY=$(date -u -d "+24 hours" +"%Y-%m-%dT%H:%MZ")
          STORAGE_KEY="${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}"

          if [[ -n "$STORAGE_KEY" ]]; then
            SAS=$(az storage container generate-sas \
              --account-name ${{ env.STORAGE_ACCOUNT }} \
              --name ${{ env.STORAGE_CONTAINER }} \
              --permissions rcwdl \
              --expiry "$EXPIRY" \
              --account-key "$STORAGE_KEY" \
              -o tsv)
          else
            SAS=$(az storage container generate-sas \
              --account-name ${{ env.STORAGE_ACCOUNT }} \
              --name ${{ env.STORAGE_CONTAINER }} \
              --permissions rcwdl \
              --expiry "$EXPIRY" \
              --auth-mode login \
              --as-user \
              -o tsv)
          fi

          if [[ -z "$SAS" ]]; then
            echo "ERROR: Failed to generate SAS token."
            echo "Provide AZURE_STORAGE_ACCOUNT_KEY secret or grant Blob Data role to OIDC principal."
            exit 1
          fi

          echo "::add-mask::$SAS"
          echo "token=$SAS" >> "$GITHUB_OUTPUT"

      - name: Prepare unique backup artifact
        id: backup_context
        run: |
          BACKUP_ENV="${{ github.event.inputs.environment || 'production' }}"
          RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          TIMESTAMP=$(date -u +"%Y-%m-%d_%H%M%S")
          STARTED_EPOCH=$(date -u +%s)

          echo "environment=$BACKUP_ENV" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "started_epoch=$STARTED_EPOCH" >> "$GITHUB_OUTPUT"

      - name: Ensure container app replica is available
        id: ensure_replica
        run: |
          ORIGINAL_MIN=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "properties.template.scale.minReplicas" \
            -o tsv)

          if [[ -z "$ORIGINAL_MIN" || "$ORIGINAL_MIN" == "null" ]]; then
            ORIGINAL_MIN=0
          fi

          echo "original_min=$ORIGINAL_MIN" >> "$GITHUB_OUTPUT"

          REPLICA_COUNT=$(az containerapp replica list \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "length(@)" -o tsv 2>/dev/null || echo 0)

          SCALE_UP=false
          if [[ "$REPLICA_COUNT" -eq 0 ]]; then
            echo "No active replicas found. Temporarily scaling min replicas to 1..."
            az containerapp update \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --min-replicas 1 \
              --output none
            SCALE_UP=true
          fi

          echo "scaled_up=$SCALE_UP" >> "$GITHUB_OUTPUT"

          echo "Waiting for at least one replica..."
          for _ in $(seq 1 30); do
            REPLICA_COUNT=$(az containerapp replica list \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --query "length(@)" -o tsv 2>/dev/null || echo 0)

            if [[ "$REPLICA_COUNT" -gt 0 ]]; then
              echo "Replica available."
              exit 0
            fi

            sleep 10
          done

          echo "ERROR: No replica became available after waiting 5 minutes."
          az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "{latestRevisionName:properties.latestRevisionName,runningStatus:properties.runningStatus,provisioningState:properties.provisioningState,scale:properties.template.scale}" \
            -o json
          exit 1

      - name: Run backup in container
        id: run_backup
        run: |
          set -o pipefail
          SAS_ESCAPED=$(printf '%q' "${{ steps.sas.outputs.token }}")
          REMOTE_CMD="AZURE_STORAGE_ACCOUNT=${{ env.STORAGE_ACCOUNT }} AZURE_STORAGE_CONTAINER=${{ env.STORAGE_CONTAINER }} AZURE_STORAGE_SAS_TOKEN=${SAS_ESCAPED} VITORA_ENV=${{ steps.backup_context.outputs.environment }} VITORA_BACKUP_TIMESTAMP=${{ steps.backup_context.outputs.timestamp }} VITORA_BACKUP_RUN_ID=${{ steps.backup_context.outputs.run_id }} /app/scripts/backup-db.sh"
          EXEC_OUTPUT=$(mktemp)
          chmod 600 "$EXEC_OUTPUT"

          set +e
          if command -v script >/dev/null 2>&1; then
            script -q -e -c "az containerapp exec --name ${{ env.CONTAINER_APP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --command \"$REMOTE_CMD\"" /dev/null >"$EXEC_OUTPUT" 2>&1
            EXEC_STATUS=$?
          else
            az containerapp exec \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --command "$REMOTE_CMD" >"$EXEC_OUTPUT" 2>&1
            EXEC_STATUS=$?
          fi
          set -e

          cat "$EXEC_OUTPUT"
          if [[ "$EXEC_STATUS" -ne 0 ]] || grep -Eq 'ClusterExecFailure|websocket: close [0-9]+|^ERROR:' "$EXEC_OUTPUT"; then
            echo "ERROR: Container exec did not complete the backup command."
            rm -f "$EXEC_OUTPUT"
            exit 1
          fi

          ARTIFACT=$(tr -d '\r' <"$EXEC_OUTPUT" | sed -n 's/^BACKUP_ARTIFACT=//p' | tail -n 1)
          EXPECTED_BASE="vitora-${{ steps.backup_context.outputs.environment }}-${{ steps.backup_context.outputs.timestamp }}-${{ steps.backup_context.outputs.run_id }}.sql.gz"
          rm -f "$EXEC_OUTPUT"

          if [[ "$ARTIFACT" != "$EXPECTED_BASE" && "$ARTIFACT" != "${EXPECTED_BASE}.gpg" ]]; then
            echo "ERROR: Backup did not confirm the expected run-scoped artifact."
            exit 1
          fi

          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"

      - name: Restore original min replica setting
        if: always() && steps.ensure_replica.outputs.scaled_up == 'true'
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --min-replicas ${{ steps.ensure_replica.outputs.original_min }} \
            --output none

      - name: Prune old backups (30-day retention)
        run: |
          CUTOFF=$(date -u -d "-30 days" +"%Y-%m-%dT%H:%M:%SZ")
          OLD_BLOBS=$(az storage blob list \
            --account-name ${{ env.STORAGE_ACCOUNT }} \
            --container-name ${{ env.STORAGE_CONTAINER }} \
            --sas-token "${{ steps.sas.outputs.token }}" \
            --query "[?properties.creationTime < '${CUTOFF}'].name" \
            -o tsv 2>/dev/null || true)

          DELETED=0
          for blob in $OLD_BLOBS; do
            az storage blob delete \
              --account-name ${{ env.STORAGE_ACCOUNT }} \
              --container-name ${{ env.STORAGE_CONTAINER }} \
              --name "$blob" \
              --sas-token "${{ steps.sas.outputs.token }}" && ((DELETED++)) || true
          done
          echo "Pruned ${DELETED} backup(s) older than 30 days"

      - name: Verify this run's backup artifact
        run: |
          ARTIFACT="${{ steps.run_backup.outputs.artifact }}"
          CREATED_AT=$(az storage blob show \
            --account-name ${{ env.STORAGE_ACCOUNT }} \
            --container-name ${{ env.STORAGE_CONTAINER }} \
            --name "$ARTIFACT" \
            --sas-token "${{ steps.sas.outputs.token }}" \
            --query "properties.creationTime" \
            -o tsv)

          if [[ -z "$CREATED_AT" ]]; then
            echo "ERROR: Expected backup artifact '$ARTIFACT' was not found."
            exit 1
          fi

          CREATED_EPOCH=$(date -u -d "$CREATED_AT" +%s)
          if [[ "$CREATED_EPOCH" -lt "${{ steps.backup_context.outputs.started_epoch }}" ]]; then
            echo "ERROR: Backup artifact '$ARTIFACT' predates this workflow run."
            exit 1
          fi

          SIZE_BYTES=$(az storage blob show \
            --account-name ${{ env.STORAGE_ACCOUNT }} \
            --container-name ${{ env.STORAGE_CONTAINER }} \
            --name "$ARTIFACT" \
            --sas-token "${{ steps.sas.outputs.token }}" \
            --query "properties.contentLength" \
            -o tsv)
          if ! [[ "$SIZE_BYTES" =~ ^[0-9]+$ ]] || [[ "$SIZE_BYTES" -lt 1024 ]]; then
            echo "ERROR: Backup artifact '$ARTIFACT' is missing or too small ($SIZE_BYTES bytes)."
            exit 1
          fi

          az storage blob show \
            --account-name ${{ env.STORAGE_ACCOUNT }} \
            --container-name ${{ env.STORAGE_CONTAINER }} \
            --name "$ARTIFACT" \
            --sas-token "${{ steps.sas.outputs.token }}" \
            --query "{name:name,size:properties.contentLength,created:properties.creationTime}" \
            -o table
