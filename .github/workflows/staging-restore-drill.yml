# Purpose: Verify an encrypted staging backup can be restored into isolated PostgreSQL.
# Use: Runs monthly or manually from the GitHub Actions UI; requires staging environment Azure/OIDC and BACKUP_ENCRYPTION_KEY secrets.
# Inputs: GitHub staging environment secrets and blobs in the private staging-db-backups container.
name: Staging Monthly Restore Drill

on:
  schedule:
    - cron: '0 3 1-7 * 0'
  workflow_dispatch:

jobs:
  restore-validate:
    name: Restore staging backup into isolated PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    permissions:
      id-token: write
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: restore_drill
          POSTGRES_USER: restore_drill
          POSTGRES_PASSWORD: restore_drill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restore_drill -d restore_drill"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Log in to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_SA_CLIENT_ID != '' && secrets.AZURE_SA_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_SA_TENANT_ID != '' && secrets.AZURE_SA_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SA_SUBSCRIPTION_ID != '' && secrets.AZURE_SA_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Download, verify, and restore latest staging backup
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          STORAGE_ACCOUNT: vitorabackupssa
          STORAGE_CONTAINER: staging-db-backups
          PGPASSWORD: restore_drill
        run: |
          set -euo pipefail
          test -n "$BACKUP_ENCRYPTION_KEY"
          BLOB_NAME=$(az storage blob list --account-name "$STORAGE_ACCOUNT" \
            --auth-mode login \
            --container-name "$STORAGE_CONTAINER" \
            --query "sort_by([?ends_with(name, '.sql.gz.gpg')], &properties.creationTime)[-1].name" -o tsv)
          test -n "$BLOB_NAME"
          az storage blob download --account-name "$STORAGE_ACCOUNT" --auth-mode login \
            --container-name "$STORAGE_CONTAINER" --name "$BLOB_NAME" --file backup --output none
          az storage blob download --account-name "$STORAGE_ACCOUNT" --auth-mode login \
            --container-name "$STORAGE_CONTAINER" --name "${BLOB_NAME%.gpg}.sha256" --file backup.sha256 --output none
          gpg --batch --yes --passphrase "$BACKUP_ENCRYPTION_KEY" --output backup.sql.gz --decrypt backup
          test "$(cut -d' ' -f1 backup.sha256)" = "$(sha256sum backup.sql.gz | cut -d' ' -f1)"
          gunzip --stdout backup.sql.gz | psql -h 127.0.0.1 -U restore_drill -d restore_drill -v ON_ERROR_STOP=1
          psql -h 127.0.0.1 -U restore_drill -d restore_drill -Atc "SELECT COUNT(*) FROM django_migrations;"
      - name: Publish restore timing
        if: always()
        run: echo "Staging restore drill completed at $(date -u +'%Y-%m-%dT%H:%M:%SZ')."
