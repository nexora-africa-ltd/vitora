name: Build Desktop App

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      skip_signing:
        description: "Skip code signing (for testing)"
        type: boolean
        default: false

permissions:
  contents: write # For creating releases

env:
  NODE_VERSION: "22"
  RUST_TOOLCHAIN: "stable"
  CDN_BASE_URL: "https://get.vitora.digital"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            node_target: x86_64-pc-windows-msvc
            bundle_target: nsis
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            node_target: x86_64-unknown-linux-gnu
            bundle_target: deb
          - platform: macos-latest
            target: aarch64-apple-darwin
            node_target: aarch64-apple-darwin
            bundle_target: dmg

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: |
            web-app/package-lock.json
            desktop-app/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-app/src-tauri -> target

      # Linux dependencies for Tauri
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      # Build Next.js web-app
      - name: Install web-app dependencies
        run: npm ci
        working-directory: web-app

      - name: Build web-app (standalone)
        run: npm run build
        working-directory: web-app
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://vitora-api.agreeabledune-6cc420cc.eastus.azurecontainerapps.io' }}
          NEXT_PUBLIC_POWERSYNC_URL: ""

      # Prepare desktop-app
      - name: Install desktop-app dependencies
        run: npm ci
        working-directory: desktop-app

      - name: Bundle standalone Next.js server
        run: npm run bundle-standalone
        working-directory: desktop-app

      - name: Verify standalone bundle integrity
        shell: bash
        working-directory: desktop-app/src-tauri
        run: |
          set +o pipefail  # tar | grep triggers SIGPIPE with pipefail
          echo "Checking standalone archive..."
          test -f standalone.tar.gz || { echo "FAIL: standalone.tar.gz missing"; exit 1; }
          ARCHIVE_SIZE=$(stat -c%s standalone.tar.gz 2>/dev/null || stat -f%z standalone.tar.gz)
          echo "Archive size: $((ARCHIVE_SIZE / 1024 / 1024))MB"
          # List archive contents to a file to avoid pipe issues
          tar -tzf standalone.tar.gz > /tmp/archive-contents.txt
          echo "Total files in archive: $(wc -l < /tmp/archive-contents.txt)"
          # Show first 20 entries for debugging
          head -20 /tmp/archive-contents.txt
          # Verify critical files exist
          grep -q "server\.js" /tmp/archive-contents.txt || { echo "FAIL: server.js not in archive"; exit 1; }
          grep -q "node_modules/next/" /tmp/archive-contents.txt || { echo "FAIL: node_modules/next not in archive"; exit 1; }
          grep -q "\.next/" /tmp/archive-contents.txt || { echo "FAIL: .next not in archive"; exit 1; }
          if tar -xOzf standalone.tar.gz 2>/dev/null | grep -q "api\.vitora\.digital"; then
            echo "FAIL: legacy api.vitora.digital host found in standalone archive"
            exit 1
          fi
          echo "Standalone archive verified OK"

      - name: Download Node.js binary for sidecar
        run: node scripts/download-node.js --target ${{ matrix.node_target }}
        working-directory: desktop-app

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # Build Tauri
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop-app
          tauriScript: npm run tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundle_target }}

      - name: Upload desktop bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: desktop-app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*
          if-no-files-found: error
          retention-days: 7

  # Generate updater endpoint JSON after all platforms build
  publish-updater:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download desktop bundle artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist/desktop
          merge-multiple: true

      - name: Upload desktop artifacts to Azure Blob
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          TAG="${GITHUB_REF_NAME}"

          find dist/desktop -type f \
            \( -name '*.exe' -o -name '*.exe.sig' -o -name '*.deb' -o -name '*.deb.sig' -o -name '*.dmg' -o -name '*.dmg.sig' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' -o -name '*.AppImage' -o -name '*.AppImage.sig' \) \
            -print0 | while IFS= read -r -d '' file; do
              name=$(basename "$file")
              content_type="application/octet-stream"
              case "$name" in
                *.exe) content_type="application/vnd.microsoft.portable-executable" ;;
                *.deb) content_type="application/vnd.debian.binary-package" ;;
                *.dmg) content_type="application/x-apple-diskimage" ;;
                *.tar.gz) content_type="application/gzip" ;;
                *.AppImage) content_type="application/octet-stream" ;;
                *.sig) content_type="text/plain" ;;
              esac

              az storage blob upload \
                --container-name releases \
                --name "desktop/${TAG}/${name}" \
                --file "$file" \
                --overwrite \
                --content-type "$content_type"
            done

      - name: Create or update GitHub Release (best effort)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#desktop-v}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Vitora HMIS Desktop ${TAG}" \
              --notes "Desktop application release for Vitora HMIS ${VERSION}."
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "Vitora HMIS Desktop ${TAG}" \
              --notes "Desktop application release for Vitora HMIS ${VERSION}."
          fi

          find dist/desktop -type f \
            \( -name '*.exe' -o -name '*.exe.sig' -o -name '*.deb' -o -name '*.deb.sig' -o -name '*.dmg' -o -name '*.dmg.sig' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' -o -name '*.AppImage' -o -name '*.AppImage.sig' \) \
            -print0 | while IFS= read -r -d '' file; do
              gh release upload "$TAG" "$file" --clobber --repo "$GITHUB_REPOSITORY"
            done

      - name: Generate updater manifest
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#desktop-v}"

          node -e "
          const fs = require('fs');
          const path = require('path');
          const version = '${VERSION}';
          const cdnUrl = '${CDN_BASE_URL}/desktop/${TAG}';

          function walk(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const fullPath = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(fullPath) : [fullPath];
            });
          }

          const files = walk('dist/desktop');
          function findFile(pattern) {
            return files.find((file) => pattern.test(path.basename(file)));
          }

          function assetUrl(file) {
            return cdnUrl + '/' + encodeURIComponent(path.basename(file));
          }

          function signatureFor(file) {
            const sigFile = file + '.sig';
            return fs.existsSync(sigFile) ? fs.readFileSync(sigFile, 'utf8').trim() : '';
          }

          const platforms = {};

          // Windows NSIS
          const winNsis = findFile(/\.exe$/);
          if (winNsis) {
            platforms['windows-x86_64'] = {
              signature: signatureFor(winNsis),
              url: assetUrl(winNsis)
            };
          }

          // Linux package
          const linuxPackage = findFile(/\.(AppImage|deb)$/);
          if (linuxPackage) {
            platforms['linux-x86_64'] = {
              signature: signatureFor(linuxPackage),
              url: assetUrl(linuxPackage)
            };
          }

          // macOS
          const macPackage = findFile(/(\.app\.tar\.gz|\.dmg)$/);
          if (macPackage) {
            platforms['darwin-aarch64'] = {
              signature: signatureFor(macPackage),
              url: assetUrl(macPackage)
            };
          }

          const updater = {
            version: version,
            notes: 'Vitora HMIS Desktop ' + version,
            pub_date: new Date().toISOString(),
            platforms
          };

          fs.writeFileSync('/tmp/latest.json', JSON.stringify(updater, null, 2));
          console.log(JSON.stringify(updater, null, 2));
          "

      - name: Upload updater manifest to Azure Blob
        if: env.AZURE_STORAGE_CONNECTION_STRING != ''
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          az storage blob upload \
            --container-name releases \
            --name updates \
            --file /tmp/latest.json \
            --overwrite \
            --content-type application/json \
            --content-cache-control "max-age=300"

      - name: Upload updater manifest as release asset
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" /tmp/latest.json --clobber --repo "$GITHUB_REPOSITORY"
