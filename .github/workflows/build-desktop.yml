name: Build Desktop App

# ===========================================================================
# Vitora HMIS — Desktop App Build Pipeline (Tauri v2 + Next.js)
# ===========================================================================
#
# Builds cross-platform desktop installers using Tauri v2 (Rust + WebView).
# The desktop app bundles a standalone Next.js server (from web-app/) and a
# Node.js sidecar binary, so the full frontend runs locally without a browser.
#
# Trigger:
#   - Push a tag matching `desktop-v*` (e.g., `desktop-v0.3.0`)
#   - Manual dispatch (workflow_dispatch) for testing
#
# Environment selection:
#   - Tag builds always use `production`
#   - Manual builds choose `staging` or `production` via input
#
# Build matrix:
#   | Platform       | Target                       | Output       |
#   |----------------|------------------------------|--------------|
#   | Windows x64    | x86_64-pc-windows-msvc       | .exe (NSIS)  |
#   | Linux x64      | x86_64-unknown-linux-gnu     | .deb         |
#   | macOS ARM      | aarch64-apple-darwin         | .dmg         |
#
# Publish pipeline (publish-updater job):
#   1. Collects artifacts from all 3 platform builds
#   2. Uploads installers + .sig files to Azure Blob Storage:
#        Container: releases → desktop/{tag}/{filename}
#        CDN URL:   https://get.vitora.digital/desktop/{tag}/{filename}
#   3. Creates/updates a GitHub Release with all platform binaries
#   4. Generates `latest.json` updater manifest (Tauri built-in updater)
#      and uploads to both Azure Blob (`releases/updates`) and GitHub Release
#
# Updater flow:
#   The desktop app checks `https://get.vitora.digital/updates` for new
#   versions. The `latest.json` manifest contains version, signature, and
#   per-platform download URLs. Tauri's built-in updater handles download,
#   signature verification, and in-place upgrade.
#
# Required secrets:
#   - TAURI_SIGNING_PRIVATE_KEY      — Ed25519 key for update signature (.sig)
#   - TAURI_SIGNING_PRIVATE_KEY_PASSWORD — passphrase for the signing key
#   - AZURE_STORAGE_CONNECTION_STRING — Azure Blob Storage (container: releases)
#   - RELEASE_TOKEN                   — GitHub PAT with contents:write scope
#
# Required vars (GitHub environment):
#   - NEXT_PUBLIC_API_URL             — Backend API base URL (required, no fallback)
# ===========================================================================

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      skip_signing:
        description: "Skip code signing (for testing)"
        type: boolean
        default: false
      deploy_env:
        description: "Target environment for API URL"
        type: choice
        options:
          - staging
          - production
        default: staging

permissions:
  contents: write # For creating releases

env:
  NODE_VERSION: "22"
  RUST_TOOLCHAIN: "stable"
  CDN_BASE_URL: "https://get.vitora.digital"

jobs:
  # --- Stage 1: Build per-platform installers in parallel ---
  build:
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_env || 'production' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            node_target: x86_64-pc-windows-msvc
            bundle_target: nsis
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            node_target: x86_64-unknown-linux-gnu
            bundle_target: deb
          - platform: macos-latest
            target: aarch64-apple-darwin
            node_target: aarch64-apple-darwin
            bundle_target: dmg

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: |
            web-app/package-lock.json
            desktop-app/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-app/src-tauri -> target

      # --- Linux system deps (WebKit2GTK for Tauri WebView) ---
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      # --- Build the Next.js frontend in "standalone" output mode ---
      # Standalone mode produces a self-contained server.js + minimal node_modules
      # that gets bundled inside the Tauri app as a sidecar.
      - name: Install web-app dependencies
        run: npm ci
        working-directory: web-app

      - name: Validate NEXT_PUBLIC_API_URL
        shell: bash
        run: |
          if [[ -z "${{ vars.NEXT_PUBLIC_API_URL }}" ]]; then
            echo "ERROR: NEXT_PUBLIC_API_URL is not set for environment '${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_env || 'production' }}'."
            echo "Set it in GitHub Environments -> Variables before running this workflow."
            exit 1
          fi
          echo "Using NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}"

      - name: Build web-app (standalone)
        run: npm run build
        working-directory: web-app
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_POWERSYNC_URL: ""
          VITORA_DESKTOP: "1"

      # --- Bundle standalone Next.js server into Tauri resources ---
      # `bundle-standalone` creates standalone.tar.gz containing server.js,
      # .next/, and node_modules — extracted at runtime by the Rust sidecar manager.
      - name: Install desktop-app dependencies
        run: npm ci
        working-directory: desktop-app

      - name: Bundle standalone Next.js server
        run: npm run bundle-standalone
        working-directory: desktop-app

      - name: Verify standalone bundle integrity
        shell: bash
        working-directory: desktop-app/src-tauri
        run: |
          set +o pipefail  # tar | grep triggers SIGPIPE with pipefail
          echo "Checking standalone archive..."
          test -f standalone.tar.gz || { echo "FAIL: standalone.tar.gz missing"; exit 1; }
          ARCHIVE_SIZE=$(stat -c%s standalone.tar.gz 2>/dev/null || stat -f%z standalone.tar.gz)
          echo "Archive size: $((ARCHIVE_SIZE / 1024 / 1024))MB"
          # List archive contents to a file to avoid pipe issues
          tar -tzf standalone.tar.gz > /tmp/archive-contents.txt
          echo "Total files in archive: $(wc -l < /tmp/archive-contents.txt)"
          # Show first 20 entries for debugging
          head -20 /tmp/archive-contents.txt
          # Verify critical files exist
          grep -q "server\.js" /tmp/archive-contents.txt || { echo "FAIL: server.js not in archive"; exit 1; }
          grep -q "node_modules/next/" /tmp/archive-contents.txt || { echo "FAIL: node_modules/next not in archive"; exit 1; }
          grep -q "\.next/" /tmp/archive-contents.txt || { echo "FAIL: .next not in archive"; exit 1; }
          # Legacy host check is handled by bundle-standalone.js with comparison-context awareness
          echo "Standalone archive verified OK"

      # --- Node.js sidecar: platform-specific Node binary bundled with the app ---
      # The desktop app ships its own Node.js to run the Next.js standalone server
      # without requiring Node to be installed on the user's machine.
      - name: Download Node.js binary for sidecar
        run: node scripts/download-node.js --target ${{ matrix.node_target }}
        working-directory: desktop-app

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # --- Compile Rust + bundle installer (NSIS/deb/dmg) ---
      # Tauri action compiles the Rust shell, embeds web assets + sidecar,
      # and produces the platform-specific installer. Update signatures (.sig)
      # are generated using TAURI_SIGNING_PRIVATE_KEY.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CARGO_HTTP_MULTIPLEXING: "false"
        with:
          projectPath: desktop-app
          tauriScript: npm run tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundle_target }}

      - name: Upload desktop bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: desktop-app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*
          if-no-files-found: error
          retention-days: 7

  # --- Stage 2: Publish artifacts + updater manifest ---
  # Runs after all platform builds complete. Uploads to Azure CDN and
  # generates the Tauri updater manifest (latest.json) so existing installs
  # can self-update via the built-in updater dialog.
  publish-updater:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download desktop bundle artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist/desktop
          merge-multiple: true

      # --- Upload installers + signatures to Azure CDN ---
      # Each platform's installer and .sig are uploaded to:
      #   releases/desktop/{tag}/{filename}
      # Public CDN URL: https://get.vitora.digital/desktop/{tag}/{filename}
      - name: Upload desktop artifacts to Azure Blob
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          TAG="${GITHUB_REF_NAME}"

          find dist/desktop -type f \
            \( -name '*.exe' -o -name '*.exe.sig' -o -name '*.deb' -o -name '*.deb.sig' -o -name '*.dmg' -o -name '*.dmg.sig' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' -o -name '*.AppImage' -o -name '*.AppImage.sig' \) \
            -print0 | while IFS= read -r -d '' file; do
              name=$(basename "$file")
              content_type="application/octet-stream"
              case "$name" in
                *.exe) content_type="application/vnd.microsoft.portable-executable" ;;
                *.deb) content_type="application/vnd.debian.binary-package" ;;
                *.dmg) content_type="application/x-apple-diskimage" ;;
                *.tar.gz) content_type="application/gzip" ;;
                *.AppImage) content_type="application/octet-stream" ;;
                *.sig) content_type="text/plain" ;;
              esac

              az storage blob upload \
                --container-name releases \
                --name "desktop/${TAG}/${name}" \
                --file "$file" \
                --overwrite \
                --content-type "$content_type"
            done

      # --- GitHub Release ---
      # Creates a published release with all platform binaries attached.
      - name: Create or update GitHub Release (best effort)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#desktop-v}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Vitora HMIS Desktop ${TAG}" \
              --notes "Desktop application release for Vitora HMIS ${VERSION}."
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Vitora HMIS Desktop ${TAG}" \
              --notes "Desktop application release for Vitora HMIS ${VERSION}."
          fi

          find dist/desktop -type f \
            \( -name '*.exe' -o -name '*.exe.sig' -o -name '*.deb' -o -name '*.deb.sig' -o -name '*.dmg' -o -name '*.dmg.sig' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' -o -name '*.AppImage' -o -name '*.AppImage.sig' \) \
            -print0 | while IFS= read -r -d '' file; do
              gh release upload "$TAG" "$file" --clobber --repo "$GITHUB_REPOSITORY"
            done

      # --- Tauri auto-updater manifest (latest.json) ---
      # Generates a JSON manifest that the Tauri built-in updater checks.
      # Contains per-platform download URLs + Ed25519 signatures.
      # Uploaded to: releases/updates (Azure) and GitHub Release asset.
      # Desktop app polls: https://get.vitora.digital/updates
      - name: Generate updater manifest
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#desktop-v}"

          node -e "
          const fs = require('fs');
          const path = require('path');
          const version = '${VERSION}';
          const cdnUrl = '${CDN_BASE_URL}/desktop/${TAG}';

          function walk(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const fullPath = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(fullPath) : [fullPath];
            });
          }

          const files = walk('dist/desktop');
          function findFile(pattern) {
            return files.find((file) => pattern.test(path.basename(file)));
          }

          function assetUrl(file) {
            return cdnUrl + '/' + encodeURIComponent(path.basename(file));
          }

          function signatureFor(file) {
            const sigFile = file + '.sig';
            return fs.existsSync(sigFile) ? fs.readFileSync(sigFile, 'utf8').trim() : '';
          }

          const platforms = {};

          // Windows NSIS
          const winNsis = findFile(/\.exe$/);
          if (winNsis) {
            platforms['windows-x86_64'] = {
              signature: signatureFor(winNsis),
              url: assetUrl(winNsis)
            };
          }

          // Linux package
          const linuxPackage = findFile(/\.(AppImage|deb)$/);
          if (linuxPackage) {
            platforms['linux-x86_64'] = {
              signature: signatureFor(linuxPackage),
              url: assetUrl(linuxPackage)
            };
          }

          // macOS
          const macPackage = findFile(/(\.app\.tar\.gz|\.dmg)$/);
          if (macPackage) {
            platforms['darwin-aarch64'] = {
              signature: signatureFor(macPackage),
              url: assetUrl(macPackage)
            };
          }

          const updater = {
            version: version,
            notes: 'Vitora HMIS Desktop ' + version,
            pub_date: new Date().toISOString(),
            platforms
          };

          fs.writeFileSync('/tmp/latest.json', JSON.stringify(updater, null, 2));
          console.log(JSON.stringify(updater, null, 2));
          "

      # Blob path: releases/updates (no version suffix — always "latest")
      - name: Upload updater manifest to Azure Blob
        if: env.AZURE_STORAGE_CONNECTION_STRING != ''
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          az storage blob upload \
            --container-name releases \
            --name updates \
            --file /tmp/latest.json \
            --overwrite \
            --content-type application/json \
            --content-cache-control "max-age=300"

      # Also attach to GitHub Release so it's visible in the release page.
      - name: Upload updater manifest as release asset
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" /tmp/latest.json --clobber --repo "$GITHUB_REPOSITORY"
