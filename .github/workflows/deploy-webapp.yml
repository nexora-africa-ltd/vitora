name: Deploy Web App to Azure Container Apps

on:
  push:
    tags:
      - 'production'
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: vitora-rg
  AZURE_LOCATION: eastus
  CONTAINER_APP_NAME: vitora-webapp-staging
  CONTAINER_APP_ENV: vitora-env
  REGISTRY_NAME: vitoraacr
  IMAGE_NAME: vitora-webapp

jobs:
  build-and-deploy:
    name: Build & Deploy Web App
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ env.REGISTRY_NAME }}

      - name: Build and push Docker image
        working-directory: web-app
        run: |
          IMAGE_TAG="${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          IMAGE_LATEST="${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest"

          docker build \
            --build-arg NEXT_PUBLIC_API_URL="${{ vars.API_URL || 'https://vitora-api.agreeabledune-6cc420cc.eastus.azurecontainerapps.io' }}" \
            --build-arg NEXT_PUBLIC_APP_NAME="Vitora HMIS" \
            --build-arg NEXT_PUBLIC_ENV=production \
            --build-arg NEXT_PUBLIC_DEMO_MODE=false \
            --build-arg NEXT_PUBLIC_ENABLE_BILLING=true \
            --build-arg NEXT_PUBLIC_ENABLE_LAB=true \
            --build-arg NEXT_PUBLIC_ENABLE_PHARMACY=true \
            --build-arg NEXT_PUBLIC_ENABLE_TRIAGE=true \
            --build-arg NEXT_PUBLIC_ENABLE_INPATIENT=true \
            --build-arg NEXT_PUBLIC_ENABLE_THEATRE=true \
            --build-arg NEXT_PUBLIC_ENABLE_AI=true \
            --build-arg NEXT_PUBLIC_POWERSYNC_URL="${{ vars.POWERSYNC_URL || '' }}" \
            --build-arg NEXT_PUBLIC_SENTRY_DSN="${{ vars.SENTRY_DSN || '' }}" \
            -t "$IMAGE_TAG" \
            -t "$IMAGE_LATEST" \
            .

          docker push "$IMAGE_TAG"
          docker push "$IMAGE_LATEST"

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          containerAppEnvironment: ${{ env.CONTAINER_APP_ENV }}
          imageToDeploy: ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          targetPort: 3000
          ingress: external

      - name: Output deployment URL
        run: echo "🚀 Deployed to https://staging.vitora.digital"
