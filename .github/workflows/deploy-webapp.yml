name: Deploy Production Web App to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: vitora-rg-sa
  AZURE_LOCATION: southafricanorth
  CONTAINER_APP_ENV: vitora-env-private-sa
  REGISTRY_NAME: vitoraacrsa
  IMAGE_NAME: vitora-webapp
  EXPECTED_AZURE_SUBSCRIPTION_ID: b7dc0a20-1bad-484b-bd8a-c22e7698bdd3

jobs:
  build-and-deploy:
    name: Build & Deploy Production Web App
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read

    env:
      DEPLOY_ENV: production
      CONTAINER_APP_NAME: vitora-webapp-prod-sa

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_SA_CLIENT_ID != '' && secrets.AZURE_SA_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_SA_TENANT_ID != '' && secrets.AZURE_SA_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SA_SUBSCRIPTION_ID != '' && secrets.AZURE_SA_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure deployment subscription
        run: |
          ACTUAL_SUBSCRIPTION_ID=$(az account show --query id --output tsv)
          if [ "$ACTUAL_SUBSCRIPTION_ID" != "${{ env.EXPECTED_AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "ERROR: Azure login selected $ACTUAL_SUBSCRIPTION_ID, but vitoraacrsa is in ${{ env.EXPECTED_AZURE_SUBSCRIPTION_ID }}."
            echo "Set the production AZURE_SA_SUBSCRIPTION_ID GitHub environment secret to the expected subscription ID."
            exit 1
          fi

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ env.REGISTRY_NAME }}

      - name: Build and push Docker image
        working-directory: web-app
        run: |
          IMAGE_TAG="${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          IMAGE_LATEST="${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.DEPLOY_ENV }}-latest"

          docker build \
            --build-arg NEXT_PUBLIC_API_URL="${{ vars.API_URL || vars.NEXT_PUBLIC_API_URL || 'https://api.vitora.digital' }}" \
            --build-arg NEXT_PUBLIC_APP_NAME="Vitora HMIS" \
            --build-arg NEXT_PUBLIC_ENV=${{ env.DEPLOY_ENV }} \
            --build-arg NEXT_PUBLIC_DEMO_MODE=false \
            --build-arg NEXT_PUBLIC_ENABLE_BILLING=true \
            --build-arg NEXT_PUBLIC_ENABLE_LAB=true \
            --build-arg NEXT_PUBLIC_ENABLE_PHARMACY=true \
            --build-arg NEXT_PUBLIC_ENABLE_TRIAGE=true \
            --build-arg NEXT_PUBLIC_ENABLE_INPATIENT=true \
            --build-arg NEXT_PUBLIC_ENABLE_THEATRE=true \
            --build-arg NEXT_PUBLIC_ENABLE_AI=true \
            --build-arg NEXT_PUBLIC_POWERSYNC_URL="${{ vars.POWERSYNC_URL || '' }}" \
            --build-arg NEXT_PUBLIC_SENTRY_DSN="${{ vars.SENTRY_DSN || '' }}" \
            --build-arg NEXT_PUBLIC_UMAMI_URL="${{ vars.UMAMI_URL || '' }}" \
            --build-arg NEXT_PUBLIC_UMAMI_WEBSITE_ID="${{ vars.UMAMI_WEBSITE_ID || '' }}" \
            --build-arg NEXT_PUBLIC_UMAMI_SCRIPT_INTEGRITY="${{ vars.UMAMI_SCRIPT_INTEGRITY || '' }}" \
            -t "$IMAGE_TAG" \
            -t "$IMAGE_LATEST" \
            .

          docker push "$IMAGE_TAG"
          docker push "$IMAGE_LATEST"

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          containerAppEnvironment: ${{ env.CONTAINER_APP_ENV }}
          imageToDeploy: ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          targetPort: 3000
          ingress: external

      - name: Output deployment URL
        run: echo "Deployed production web app to https://app.vitora.digital"
