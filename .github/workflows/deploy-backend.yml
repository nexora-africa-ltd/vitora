name: Deploy Backend to Azure Container Apps

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  AZURE_RESOURCE_GROUP: vitora-rg-sa
  AZURE_LOCATION: southafricanorth
  CONTAINER_APP_ENV: vitora-env-private-sa
  REGISTRY_NAME: ${{ vars.ACR_NAME || 'vitoraacrsa' }}
  IMAGE_NAME: vitora-api-private-sa
  EXPECTED_AZURE_SUBSCRIPTION_ID: b7dc0a20-1bad-484b-bd8a-c22e7698bdd3

jobs:
  build-and-deploy:
    name: Build & Deploy to ACA (${{ github.event.inputs.environment || (github.ref_name == 'main' && 'production') || 'staging' }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || (github.ref_name == 'main' && 'production') || 'staging' }}
    permissions:
      id-token: write
      contents: read

    env:
      DEPLOY_ENV: ${{ github.event.inputs.environment || (github.ref_name == 'main' && 'production') || 'staging' }}
      CONTAINER_APP_NAME: ${{ (github.event.inputs.environment == 'production' || github.ref_name == 'main') && 'vitora-api-prod-private-sa' || 'vitora-api-private-sa' }}
      WORKER_APP_NAME: ${{ (github.event.inputs.environment == 'production' || github.ref_name == 'main') && 'vitora-worker-private-prod-sa' || 'vitora-worker-private-sa' }}
      BEAT_APP_NAME: ${{ (github.event.inputs.environment == 'production' || github.ref_name == 'main') && 'vitora-beat-private-prod-sa' || 'vitora-beat-private-sa' }}
      ASYNC_WORKERS_ENABLED: ${{ vars.ASYNC_WORKERS_ENABLED || 'false' }}
      API_MIN_REPLICAS: 1
      API_MAX_REPLICAS: ${{ vars.ASYNC_WORKERS_ENABLED == 'true' && 6 || 1 }}
      WORKER_MIN_REPLICAS: 1
      WORKER_MAX_REPLICAS: 4

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_SA_CLIENT_ID != '' && secrets.AZURE_SA_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_SA_TENANT_ID != '' && secrets.AZURE_SA_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SA_SUBSCRIPTION_ID != '' && secrets.AZURE_SA_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure deployment subscription
        run: |
          ACTUAL_SUBSCRIPTION_ID=$(az account show --query id --output tsv)
          if [ "$ACTUAL_SUBSCRIPTION_ID" != "${{ env.EXPECTED_AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "ERROR: Azure login selected $ACTUAL_SUBSCRIPTION_ID, but vitoraacrsa is in ${{ env.EXPECTED_AZURE_SUBSCRIPTION_ID }}."
            echo "Set the production AZURE_SA_SUBSCRIPTION_ID GitHub environment secret to the expected subscription ID."
            exit 1
          fi

      - name: Log in to Azure Container Registry
        run: |
          az account show --query "{name:name,id:id,tenantId:tenantId}" -o table
          az acr show --name "${{ env.REGISTRY_NAME }}" --query "{name:name,loginServer:loginServer,resourceGroup:resourceGroup}" -o table
          az acr login --name "${{ env.REGISTRY_NAME }}"

      - name: Build and push Docker image
        working-directory: backend
        run: |
          IMAGE_TAG="${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          IMAGE_LATEST="${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest"
          docker build -t "$IMAGE_TAG" -t "$IMAGE_LATEST" .
          docker push "$IMAGE_TAG"
          docker push "$IMAGE_LATEST"

      - name: Configure Container Apps registry access
        run: |
          ACR_USERNAME=$(az acr credential show --name "${{ env.REGISTRY_NAME }}" --query username --output tsv)
          ACR_PASSWORD=$(az acr credential show --name "${{ env.REGISTRY_NAME }}" --query 'passwords[0].value' --output tsv)
          az containerapp registry set \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --server "${{ env.REGISTRY_NAME }}.azurecr.io" \
            --username "$ACR_USERNAME" \
            --password "$ACR_PASSWORD"

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          containerAppEnvironment: ${{ env.CONTAINER_APP_ENV }}
          imageToDeploy: ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          targetPort: 8000
          ingress: external

      - name: Apply backend environment variables
        env:
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          AZURE_HUB_BACKUP_STORAGE_ACCOUNT_KEY: ${{ secrets.AZURE_HUB_BACKUP_STORAGE_ACCOUNT_KEY }}
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          SECRET_ARGS=()
          if [[ -n "$PAYSTACK_SECRET_KEY" ]]; then
            SECRET_ARGS+=("paystack-secret-key=$PAYSTACK_SECRET_KEY")
          fi
          if [[ -n "$AZURE_HUB_BACKUP_STORAGE_ACCOUNT_KEY" ]]; then
            SECRET_ARGS+=("azure-hub-backup-storage-account-key=$AZURE_HUB_BACKUP_STORAGE_ACCOUNT_KEY")
          fi
          if [[ ${#SECRET_ARGS[@]} -gt 0 ]]; then
            az containerapp secret set \
              --name "${{ env.CONTAINER_APP_NAME }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --secrets "${SECRET_ARGS[@]}" \
              --output none
          fi
          az containerapp update \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --replace-env-vars \
            DJANGO_ENV=${{ env.DEPLOY_ENV }} \
            DJANGO_SETTINGS_MODULE=hmis.settings.${{ env.DEPLOY_ENV }} \
            DATABASE_URL=secretref:database-url \
            VITORA_DB_APPLICATION_NAME=vitora-${{ env.DEPLOY_ENV }}-api \
            DB_CONN_MAX_AGE=${{ vars.DB_CONN_MAX_AGE || (env.DEPLOY_ENV == 'production' && '600' || '60') }} \
            DB_POOL_MIN_SIZE=${{ vars.DB_POOL_MIN_SIZE || '1' }} \
            DB_POOL_MAX_SIZE=${{ vars.DB_POOL_MAX_SIZE || (env.DEPLOY_ENV == 'production' && '4' || '8') }} \
            REDIS_URL=${{ env.ASYNC_WORKERS_ENABLED == 'true' && 'secretref:redis-url' || '' }} \
            ENCRYPTION_KEY=secretref:encryption-key \
            PII_HMAC_KEY=secretref:pii-hmac-key \
            ORGANIZATION_PII_ENCRYPTION_ENABLED=true \
            AZURE_STORAGE_CONNECTION_STRING=secretref:azure-storage-connection-string \
            AZURE_MEDIA_STORAGE_CONNECTION_STRING=secretref:azure-media-storage-connection-string \
            DJANGO_SECRET_KEY=secretref:django-secret-key \
            PAYSTACK_SECRET_KEY=secretref:paystack-secret-key \
            PAYSTACK_PUBLIC_KEY=${{ vars.PAYSTACK_PUBLIC_KEY || '' }} \
            PAYSTACK_CALLBACK_URL=${{ vars.PAYSTACK_CALLBACK_URL || (env.DEPLOY_ENV == 'production' && 'https://app.vitora.digital/account-billing?payment=returned' || 'https://staging.vitora.digital/account-billing?payment=returned') }} \
            PAYSTACK_WEBHOOK_URL=${{ vars.PAYSTACK_WEBHOOK_URL || (env.DEPLOY_ENV == 'production' && 'https://api.vitora.digital/api/payments/paystack/webhook/' || 'https://staging-api.vitora.digital/api/payments/paystack/webhook/') }} \
            HUB_BACKUP_CREDENTIAL_SIGNER=${{ vars.HUB_BACKUP_CREDENTIAL_SIGNER || 'hmis.apps.licensing.backup_credentials.sign_azure_blob_backup_credentials' }} \
            HUB_BACKUP_ALLOWED_RESIDENCY_COUNTRIES=${{ vars.HUB_BACKUP_ALLOWED_RESIDENCY_COUNTRIES || 'KE' }} \
            AZURE_HUB_BACKUP_STORAGE_ACCOUNT=${{ vars.AZURE_HUB_BACKUP_STORAGE_ACCOUNT || 'vitorabackupssa' }} \
            AZURE_HUB_BACKUP_STORAGE_ACCOUNT_KEY=secretref:azure-hub-backup-storage-account-key \
            AZURE_HUB_BACKUP_STORAGE_CONTAINER=${{ vars.AZURE_HUB_BACKUP_STORAGE_CONTAINER || 'hub-backups' }} \
            AZURE_HUB_BACKUP_SAS_EXPIRY_MINUTES=${{ vars.AZURE_HUB_BACKUP_SAS_EXPIRY_MINUTES || '60' }} \
            DEBUG=false \
            PORT=8000 \
            MEDIA_BACKEND=${{ vars.MEDIA_BACKEND || 'azure_blob' }} \
            MEDIA_ROOT=${{ vars.MEDIA_ROOT || 'media' }} \
            MEDIA_URL=${{ vars.MEDIA_URL || 'https://vitoramediasa.blob.core.windows.net/vitora-media/' }} \
            MEDIA_SERVE_FROM_DJANGO=${{ vars.MEDIA_SERVE_FROM_DJANGO || 'false' }} \
            AZURE_MEDIA_CONTAINER=${{ vars.AZURE_MEDIA_CONTAINER || 'vitora-media' }} \
            MEDIA_BLOB_BASE_URL=${{ vars.MEDIA_BLOB_BASE_URL || 'https://vitoramediasa.blob.core.windows.net/vitora-media' }} \
            DEMO_MODE=${{ env.DEPLOY_ENV == 'staging' && 'true' || 'false' }} \
            ACTIVE_SHIFT_ENFORCEMENT=${{ env.DEPLOY_ENV == 'production' && 'true' || 'false' }} \
            ONBOARDING_ENFORCEMENT=${{ env.DEPLOY_ENV == 'production' && 'true' || 'false' }} \
            ALLOWED_HOSTS=${{ vars.ALLOWED_HOSTS || (env.DEPLOY_ENV == 'production' && 'api.vitora.digital,app.vitora.digital,vitora-navy.vercel.app,vitora-api-prod-private-sa.wittysmoke-66276dae.southafricanorth.azurecontainerapps.io' || 'staging-api.vitora.digital,staging.vitora.digital,vitora-api-private-sa.wittysmoke-66276dae.southafricanorth.azurecontainerapps.io') }} \
            SECURE_SSL_REDIRECT=true \
            CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS || (env.DEPLOY_ENV == 'production' && 'https://app.vitora.digital,https://api.vitora.digital,https://vitora-navy.vercel.app' || 'https://staging.vitora.digital,http://localhost:3009') }} \
            CSRF_TRUSTED_ORIGINS=${{ vars.CSRF_TRUSTED_ORIGINS || (env.DEPLOY_ENV == 'production' && 'https://app.vitora.digital,https://api.vitora.digital,https://vitora-navy.vercel.app' || 'https://staging.vitora.digital') }} \
            FRONTEND_URL=${{ vars.FRONTEND_URL || (env.DEPLOY_ENV == 'production' && 'https://app.vitora.digital' || 'https://staging.vitora.digital') }} \
            DOCUMENT_VERIFICATION_URL=${{ vars.DOCUMENT_VERIFICATION_URL || (env.DEPLOY_ENV == 'production' && 'https://app.vitora.digital/verify' || 'https://staging.vitora.digital/verify') }} \
            CLOUD_API_BASE_URL=${{ vars.CLOUD_API_BASE_URL || (env.DEPLOY_ENV == 'production' && 'https://api.vitora.digital' || 'https://staging-api.vitora.digital') }} \
            SYNC_SERVER_URL=${{ vars.SYNC_SERVER_URL || (env.DEPLOY_ENV == 'production' && 'https://api.vitora.digital/api/sync' || 'https://staging-api.vitora.digital/api/sync') }} \
            DEFAULT_FROM_EMAIL=noreply@vitora.digital \
            CELERY_TASK_ALWAYS_EAGER=${{ env.ASYNC_WORKERS_ENABLED == 'true' && 'false' || 'true' }} \
            SHA_ENABLED=true \
            SHA_API_BASE_URL=https://uat.dha.go.ke \
            SHA_AUTH_MODE=${{ vars.SHA_AUTH_MODE || 'ilm' }} \
            SHA_AUTH_BASE_URL=${{ vars.SHA_AUTH_BASE_URL || 'https://ilm-dev.dha.go.ke/uat-middleware' }} \
            SHA_AUTH_TOKEN_ENDPOINT=${{ vars.SHA_AUTH_TOKEN_ENDPOINT || '' }} \
            SHA_USERNAME=secretref:sha-username \
            SHA_PASSWORD=secretref:sha-password \
            SHA_CONSUMER_KEY=secretref:sha-consumer-key \
            SHA_CLIENT_ID=secretref:sha-client-id \
            SHA_CLIENT_SECRET=secretref:sha-client-secret \
            SHA_ENCRYPTED_PIN=secretref:sha-encrypted-pin \
            SHA_AGENT=DHABP05113 \
            SHA_FHIR_BASE_URL=https://qa-mis.apeiro-digital.com \
            SHA_API_TIMEOUT=30 \
            SHA_FACILITY_FR_CODE=${{ vars.SHA_FACILITY_FR_CODE }} \
            SHA_TIBERBU_BASE_URL=${{ vars.SHA_TIBERBU_BASE_URL }} \
            SHR_ENABLED=${{ vars.SHR_ENABLED || 'false' }} \
            SHR_ILM_BASE_URL=${{ vars.SHR_ILM_BASE_URL || 'https://ilm-dev.dha.go.ke/uat-middleware/api/v1' }} \
            ILM_BASE_URL=${{ vars.ILM_BASE_URL }} \
            ILM_REQUEST_TIMEOUT=30 \
            ILM_MAX_RETRIES=2 \
            ILM_BACKOFF_SECONDS=0.5 \
            ILM_TERMINOLOGY_OWNER=${{ vars.ILM_TERMINOLOGY_OWNER || '' }} \
            ILM_TERMINOLOGY_SOURCES=${{ vars.ILM_TERMINOLOGY_SOURCES || '' }} \
            ILM_TERMINOLOGY_COLLECTION=${{ vars.ILM_TERMINOLOGY_COLLECTION || '' }} \
            FACILITY_MFL_CODE=TEST-001 \
            FACILITY_LEVEL=L3 \
            FACILITY_NAME=Demo-Health-Facility \
            FACILITY_COUNTY=Nairobi \
            FACILITY_KRA_PIN=P000000000X \
            MPESA_ENVIRONMENT=sandbox \
            MPESA_CONSUMER_KEY=secretref:mpesa-consumer-key \
            MPESA_CONSUMER_SECRET=secretref:mpesa-consumer-secret \
            MPESA_SHORTCODE=174379 \
            MPESA_PASSKEY=secretref:mpesa-passkey \
            MPESA_CALLBACK_URL=${{ vars.MPESA_CALLBACK_URL || (env.DEPLOY_ENV == 'production' && 'https://api.vitora.digital/api/billing/mpesa/callback/' || 'https://staging-api.vitora.digital/api/billing/mpesa/callback/') }} \
            ICD11_USE_LOCAL=false \
            HAPI_FHIR_ENABLED=true \
            HAPI_FHIR_BASE_URL=${{ vars.HAPI_FHIR_BASE_URL || '' }} \
            HAPI_FHIR_TIMEOUT=10 \
            SYNC_ENABLED=${{ env.DEPLOY_ENV == 'production' && 'true' || 'false' }} \
            HL7_INTEGRATION_ENABLED=true \
            HL7_SENDING_APPLICATION=VITORA_HMIS \
            HL7_SENDING_FACILITY=DEMO_FACILITY \
            HL7_RECEIVING_APPLICATION=LAB_LIS \
            HL7_RECEIVING_FACILITY=STAGING_LIS \
            MLLP_HOST=${{ vars.MLLP_HOST || '' }} \
            MLLP_PORT=2575 \
            HL7_LIS_CODE_SYSTEM=LIS_DEFAULT \
            HIE_AUTO_CR_LOOKUP=true \
            HIE_AUTO_CR_REGISTER=true \
            HIE_AUTO_SHR_PUSH=false \
            HIE_ADX_ENABLED=false \
            FHIR_BASE_URL=${{ vars.FHIR_BASE_URL || vars.CLOUD_API_BASE_URL || (env.DEPLOY_ENV == 'production' && 'https://api.vitora.digital' || 'https://staging-api.vitora.digital') }} \
            KMS_PROVIDER=azure \
            AZURE_KEY_VAULT_URL=${{ env.DEPLOY_ENV == 'production' && 'https://vitora-kv-prod-sa.vault.azure.net/' || 'https://vitora-kv-stg-sa.vault.azure.net/' }} \
            AZURE_KEY_NAME=${{ env.DEPLOY_ENV == 'production' && 'vitora-prod-pii-kek' || 'vitora-stg-pii-kek' }} \
            HUB_DB_ESCROW_ENABLED=true \
            AZURE_HUB_DB_ESCROW_KEY_NAME=${{ env.DEPLOY_ENV == 'production' && 'vitora-prod-hub-db-escrow-kek' || 'vitora-stg-hub-db-escrow-kek' }} \
            AT_API_KEY=secretref:at-api-key \
            AT_USERNAME=sandbox \
            TIBABOT_ENABLED=true \
            TIBABOT_API_KEY=secretref:tibabot-api-key \
            TIBABOT_API_URL=https://ai.vitora.digital \
            TIBABOT_TIMEOUT=30 \
            TIBABOT_JWT_SECRET=secretref:tibabot-jwt-secret \
            TIBABOT_JWT_PRIVATE_KEY=secretref:tibabot-jwt-private-key \
            TIBABOT_JWT_KID=tibabot-vitora-1 \
            TIBABOT_JWT_ISSUER=vitora.nexora.africa \
            TIBABOT_JWT_AUDIENCE=tibabot-api \
            TIBABOT_JWT_EXPIRY_SECONDS=300 \
            TIBABOT_JWKS_URL=${{ vars.TIBABOT_JWKS_URL || (env.DEPLOY_ENV == 'production' && 'https://api.vitora.digital/.well-known/jwks.json' || 'https://staging-api.vitora.digital/.well-known/jwks.json') }} \
            TIBABOT_ADMIN_KEY=secretref:tibabot-admin-key \
            SETUP_WIZARD_ENABLED=true \
            ADMIN_MFA_ALLOW_DISABLE_OVERRIDE=${{ vars.ADMIN_MFA_ALLOW_DISABLE_OVERRIDE || (env.DEPLOY_ENV == 'staging' && 'true' || 'false') }} \
            ADMIN_SESSION_TIMEOUT_SECONDS=${{ vars.ADMIN_SESSION_TIMEOUT_SECONDS || '900' }} \
            DJANGO_LOG_LEVEL=INFO \
            SENTRY_DSN=${{ vars.SENTRY_DSN || '' }} \
            SENTRY_ENABLED=${{ vars.SENTRY_ENABLED || 'true' }} \
            SENTRY_ENVIRONMENT=${{ env.DEPLOY_ENV }} \
            SENTRY_RELEASE=${{ github.sha }} \
            SENTRY_SAMPLE_RATE=${{ vars.SENTRY_SAMPLE_RATE || '1.0' }} \
            SENTRY_TRACES_SAMPLE_RATE=${{ vars.SENTRY_TRACES_SAMPLE_RATE || '0.0' }} \
            SENTRY_PROFILES_SAMPLE_RATE=${{ vars.SENTRY_PROFILES_SAMPLE_RATE || '0.0' }} \
            SENTRY_MAX_BREADCRUMBS=${{ vars.SENTRY_MAX_BREADCRUMBS || '50' }} \
            SMS_BACKEND=${{ env.DEPLOY_ENV == 'production' && 'hmis.apps.core.sms.backends.AfricasTalkingSMSBackend' || 'hmis.apps.core.sms.backends.MockSMSBackend' }} \
            SMS_SENDER_ID=VitoraHMIS \
            PRICING_REQUIRE_SIGNED_NONCE=${{ env.DEPLOY_ENV == 'production' && 'true' || 'false' }} \
            PRICING_NONCE_SECRET=secretref:pricing-nonce-secret \
            PRICING_NONCE_TTL_SECONDS=${{ vars.PRICING_NONCE_TTL_SECONDS || '300' }} \
            PRICING_QUOTE_CACHE_TTL_SECONDS=${{ vars.PRICING_QUOTE_CACHE_TTL_SECONDS || '120' }} \
            PRICING_QUOTE_SNAPSHOT_TTL_DAYS=${{ vars.PRICING_QUOTE_SNAPSHOT_TTL_DAYS || '30' }} \
            WEBAUTHN_RP_ID=${{ vars.WEBAUTHN_RP_ID || (env.DEPLOY_ENV == 'production' && 'app.vitora.digital' || 'staging.vitora.digital') }} \
            WEBAUTHN_ORIGIN=${{ vars.WEBAUTHN_ORIGIN || (env.DEPLOY_ENV == 'production' && 'https://app.vitora.digital' || 'https://staging.vitora.digital') }} \
            METABASE_SITE_URL=${{ vars.METABASE_SITE_URL || (env.DEPLOY_ENV == 'production' && 'https://metabase.vitora.digital' || 'https://metabase.staging.vitora.digital') }} \
            METABASE_API_URL=${{ vars.METABASE_API_URL || 'http://vitora-metabase' }} \
            METABASE_EMBEDDING_SECRET=secretref:metabase-embedding-secret \
            METABASE_API_KEY=secretref:metabase-api-key \
            SUPERSET_URL=${{ vars.SUPERSET_URL || '' }} \
            SUPERSET_ADMIN_USERNAME=${{ vars.SUPERSET_ADMIN_USERNAME || 'admin' }} \
            SUPERSET_ADMIN_PASSWORD=secretref:superset-admin-password \
            RESEND_API_KEY=secretref:resend-api-key \
            RESEND_WEBHOOK_SECRET=secretref:resend-webhook-secret \
            SLACK_SIGNUP_WEBHOOK_URL=secretref:slack-signup-webhook-url \
            POWERSYNC_URL=${{ vars.POWERSYNC_URL || 'https://69d7e1b30e377e689729cf08.powersync.journeyapps.com' }} \
            POWERSYNC_JWT_KID=vitora-hmis-1 \
            POWERSYNC_JWT_AUDIENCE=${{ vars.POWERSYNC_JWT_AUDIENCE || 'https://69d7e1b30e377e689729cf08.powersync.journeyapps.com' }} \
            VAPID_PUBLIC_KEY=BK9Ze2ux8-t3w3r83bj7kOEcTuz3IfATjoyg5_TRYBVTAHaqvjRUHqpVHc6T0Ej0nbaDY5ZTVlJ7Mnle6h7ZesU \
            VAPID_PRIVATE_KEY=secretref:vapid-private-key \
            VAPID_CLAIM_EMAIL=mailto:info@nexora.africa \
            LIS_STANDALONE_MODE=${{ vars.LIS_STANDALONE_MODE || 'false' }} \
            PHARMACY_STANDALONE_MODE=${{ vars.PHARMACY_STANDALONE_MODE || 'false' }} \
            IMAGING_STANDALONE_MODE=${{ vars.IMAGING_STANDALONE_MODE || 'false' }} \
            INSURANCE_ENABLED=${{ vars.INSURANCE_ENABLED || 'false' }} \
            DHIS2_BASE_URL=${{ vars.DHIS2_BASE_URL || '' }} \
            DHIS2_USERNAME=secretref:dhis2-username \
            DHIS2_PASSWORD=secretref:dhis2-password \
            DHIS2_ORG_UNIT=${{ vars.DHIS2_ORG_UNIT || '' }} \
            FACILITY_HAS_ICU=${{ vars.FACILITY_HAS_ICU || '' }} \
            FACILITY_HAS_LABORATORY=${{ vars.FACILITY_HAS_LABORATORY || 'true' }} \
            FACILITY_HAS_IMAGING=${{ vars.FACILITY_HAS_IMAGING || '' }} \
            FACILITY_HAS_PHARMACY=${{ vars.FACILITY_HAS_PHARMACY || 'true' }} \
            FACILITY_ADDRESS=${{ vars.FACILITY_ADDRESS || '' }} \
            FACILITY_PHONE=${{ vars.FACILITY_PHONE || '' }} \
            FACILITY_EMAIL=${{ vars.FACILITY_EMAIL || '' }} \
            FACILITY_LICENSE=${{ vars.FACILITY_LICENSE || '' }} \
            LICENSE_SIGNING_KEY=secretref:license-signing-key \
            LOINC_USERNAME=secretref:loinc-username \
            LOINC_PASSWORD=secretref:loinc-password \
            --output none

      - name: Configure Redis for distributed async processing
        if: env.ASYNC_WORKERS_ENABLED == 'true'
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          if [[ -z "$REDIS_URL" ]]; then
            echo "REDIS_URL must be configured when ASYNC_WORKERS_ENABLED=true." >&2
            exit 1
          fi
          for APP_NAME in "${{ env.CONTAINER_APP_NAME }}" "${{ env.WORKER_APP_NAME }}" "${{ env.BEAT_APP_NAME }}"; do
            az containerapp secret set \
              --name "$APP_NAME" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --secrets "redis-url=$REDIS_URL" \
              --output none
          done

      - name: Apply bounded API autoscaling
        run: |
          if [[ "${{ env.DEPLOY_ENV }}" == "staging" ]]; then
            API_MIN_REPLICAS=2
            API_MAX_REPLICAS=2
            API_CONCURRENT_REQUESTS=10
          else
            API_MIN_REPLICAS="${{ env.API_MIN_REPLICAS }}"
            API_MAX_REPLICAS="${{ env.API_MAX_REPLICAS }}"
            API_CONCURRENT_REQUESTS=80
          fi
          az containerapp update \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --min-replicas "$API_MIN_REPLICAS" \
            --max-replicas "$API_MAX_REPLICAS" \
            --scale-rule-name http-concurrency \
            --scale-rule-type http \
            --scale-rule-http-concurrency "$API_CONCURRENT_REQUESTS" \
            --output none

      - name: Disable distributed async processes for budget mode
        if: env.ASYNC_WORKERS_ENABLED != 'true'
        run: |
          for APP_NAME in "${{ env.WORKER_APP_NAME }}" "${{ env.BEAT_APP_NAME }}"; do
            if az containerapp show --name "$APP_NAME" --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" >/dev/null 2>&1; then
              az containerapp update \
                --name "$APP_NAME" \
                --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
                --min-replicas 0 \
                --max-replicas 1 \
                --output none
            fi
          done

      - name: Deploy worker and singleton scheduler
        if: env.ASYNC_WORKERS_ENABLED == 'true'
        run: |
          for APP_NAME in "${{ env.WORKER_APP_NAME }}" "${{ env.BEAT_APP_NAME }}"; do
            if ! az containerapp show --name "$APP_NAME" --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" >/dev/null 2>&1; then
              echo "Missing $APP_NAME. Provision the API, worker, and Beat topology with scripts/azure-provision-sa-api-apps.sh before deployment." >&2
              exit 1
            fi
          done

          az containerapp update \
            --name "${{ env.WORKER_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --image "${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --min-replicas "${{ env.WORKER_MIN_REPLICAS }}" \
            --max-replicas "${{ env.WORKER_MAX_REPLICAS }}" \
            --set-env-vars VITORA_PROCESS=worker VITORA_DB_APPLICATION_NAME=vitora-${{ env.DEPLOY_ENV }}-worker REDIS_URL=secretref:redis-url CELERY_TASK_ALWAYS_EAGER=false \
            --output none

          az containerapp update \
            --name "${{ env.BEAT_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --image "${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --min-replicas 1 \
            --max-replicas 1 \
            --set-env-vars VITORA_PROCESS=beat VITORA_DB_APPLICATION_NAME=vitora-${{ env.DEPLOY_ENV }}-beat REDIS_URL=secretref:redis-url CELERY_TASK_ALWAYS_EAGER=false \
            --output none

      - name: Refresh backup Job image
        if: env.DEPLOY_ENV == 'production'
        run: |
          if az containerapp job show --name "vitora-db-backup-prod-sa" --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" >/dev/null 2>&1; then
            az containerapp job update \
              --name "vitora-db-backup-prod-sa" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --image "${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}" \
              --command bash /app/scripts/backup-db.sh \
              --set-env-vars "AZURE_STORAGE_ACCOUNT=vitorabackupssa" "AZURE_STORAGE_CONTAINER=db-backups" "VITORA_ENV=production" "PGAPPNAME=vitora-production-backup-job" \
              --output none
          fi

      - name: Run post-deploy maintenance
        run: |
          bash backend/scripts/aca-run-postdeploy.sh "${{ env.CONTAINER_APP_NAME }}" "${{ env.AZURE_RESOURCE_GROUP }}"
