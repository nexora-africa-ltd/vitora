name: Deploy Backend to Azure Container Apps

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: vitora-rg
  AZURE_LOCATION: eastus
  CONTAINER_APP_NAME: vitora-api
  CONTAINER_APP_ENV: vitora-env
  REGISTRY_NAME: vitoraacr
  IMAGE_NAME: vitora-api

jobs:
  build-and-deploy:
    name: Build & Deploy to ACA
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ env.REGISTRY_NAME }}

      - name: Build and push Docker image
        working-directory: backend
        run: |
          IMAGE_TAG="${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          IMAGE_LATEST="${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest"
          docker build -t "$IMAGE_TAG" -t "$IMAGE_LATEST" .
          docker push "$IMAGE_TAG"
          docker push "$IMAGE_LATEST"

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          containerAppEnvironment: ${{ env.CONTAINER_APP_ENV }}
          imageToDeploy: ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          targetPort: 8000
          ingress: external
          environmentVariables: >-
            DJANGO_SETTINGS_MODULE=hmis.settings.staging
            DATABASE_URL=secretref:database-url
            ENCRYPTION_KEY=secretref:encryption-key
            DJANGO_SECRET_KEY=secretref:django-secret-key
            DEBUG=false
            PORT=8000
            ALLOWED_HOSTS=${{ vars.ALLOWED_HOSTS || 'staging.vitora.digital,vitora-navy.vercel.app,localhost' }}
            SECURE_SSL_REDIRECT=true
            CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS || 'https://staging.vitora.digital,https://vitora-navy.vercel.app,http://localhost:3009' }}
            CSRF_TRUSTED_ORIGINS=${{ vars.CSRF_TRUSTED_ORIGINS || 'https://staging.vitora.digital,https://vitora-navy.vercel.app' }}
            FRONTEND_URL=${{ vars.FRONTEND_URL || 'https://vitora-navy.vercel.app' }}
            DOCUMENT_VERIFICATION_URL=${{ vars.DOCUMENT_VERIFICATION_URL || 'https://vitora-navy.vercel.app/verify' }}
            DEFAULT_FROM_EMAIL=noreply@vitora.digital
            DEMO_MODE=true
            CELERY_TASK_ALWAYS_EAGER=true
            SHA_ENABLED=true
            SHA_API_BASE_URL=https://uat.dha.go.ke
            SHA_AUTH_MODE=${{ vars.SHA_AUTH_MODE || 'legacy' }}
            SHA_AUTH_BASE_URL=${{ vars.SHA_AUTH_BASE_URL || 'https://uat.dha.go.ke' }}
            SHA_AUTH_TOKEN_ENDPOINT=${{ vars.SHA_AUTH_TOKEN_ENDPOINT || '' }}
            SHA_USERNAME=secretref:sha-username
            SHA_PASSWORD=secretref:sha-password
            SHA_CONSUMER_KEY=secretref:sha-consumer-key
            SHA_CLIENT_ID=${{ vars.SHA_CLIENT_ID || '' }}
            SHA_CLIENT_SECRET=secretref:sha-client-secret
            SHA_ENCRYPTED_PIN=secretref:sha-encrypted-pin
            SHA_AGENT=DHABP05113
            SHA_FHIR_BASE_URL=https://qa-mis.apeiro-digital.com
            SHA_API_TIMEOUT=30
            FACILITY_MFL_CODE=TEST-001
            FACILITY_LEVEL=L3
