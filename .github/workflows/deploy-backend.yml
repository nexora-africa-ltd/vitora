            HL7_INTEGRATION_ENABLED=true
            HL7_SENDING_APPLICATION=VITORA_HMIS
            HL7_SENDING_FACILITY=DEMO_FACILITY
            HL7_RECEIVING_APPLICATION=LAB_LIS
            HL7_RECEIVING_FACILITY=STAGING_LIS
            MLLP_HOST=${{ vars.MLLP_HOST || '' }}
            MLLP_PORT=2575
            HL7_LIS_CODE_SYSTEM=LIS_DEFAULT
            HIE_AUTO_CR_LOOKUP=true
            HIE_AUTO_CR_REGISTER=true
            HIE_AUTO_SHR_PUSH=false
            HIE_ADX_ENABLED=false
            FHIR_BASE_URL=${{ vars.FHIR_BASE_URL || vars.CLOUD_API_BASE_URL || (env.DEPLOY_ENV == 'production' && 'https://api.vitora.digital' || 'https://staging-api.vitora.digital') }}
            KMS_PROVIDER=local
            AT_API_KEY=secretref:at-api-key
            AT_USERNAME=sandbox
            TIBABOT_ENABLED=true
            TIBABOT_API_KEY=secretref:tibabot-api-key
            TIBABOT_API_URL=https://ai.vitora.digital
            TIBABOT_TIMEOUT=30
            TIBABOT_JWT_SECRET=secretref:tibabot-jwt-secret
            TIBABOT_JWT_PRIVATE_KEY=secretref:tibabot-jwt-private-key
            TIBABOT_JWT_KID=tibabot-vitora-1
            TIBABOT_JWT_ISSUER=vitora.nexora.africa
            TIBABOT_JWT_AUDIENCE=tibabot-api
            TIBABOT_JWT_EXPIRY_SECONDS=300
            TIBABOT_JWKS_URL=${{ vars.TIBABOT_JWKS_URL || (env.DEPLOY_ENV == 'production' && 'https://api.vitora.digital/.well-known/jwks.json' || 'https://staging-api.vitora.digital/.well-known/jwks.json') }}
            TIBABOT_ADMIN_KEY=secretref:tibabot-admin-key
            SETUP_WIZARD_ENABLED=true
            ADMIN_MFA_ALLOW_DISABLE_OVERRIDE=${{ vars.ADMIN_MFA_ALLOW_DISABLE_OVERRIDE || (env.DEPLOY_ENV == 'staging' && 'true' || 'false') }}
            ADMIN_SESSION_TIMEOUT_SECONDS=${{ vars.ADMIN_SESSION_TIMEOUT_SECONDS || '900' }}
            DJANGO_LOG_LEVEL=INFO
            SENTRY_DSN=${{ vars.SENTRY_DSN || '' }}
            SENTRY_ENABLED=${{ vars.SENTRY_ENABLED || 'true' }}
            SENTRY_ENVIRONMENT=${{ env.DEPLOY_ENV }}
            SENTRY_RELEASE=${{ github.sha }}
            SENTRY_SAMPLE_RATE=${{ vars.SENTRY_SAMPLE_RATE || '1.0' }}
            SENTRY_TRACES_SAMPLE_RATE=${{ vars.SENTRY_TRACES_SAMPLE_RATE || '0.0' }}
            SENTRY_PROFILES_SAMPLE_RATE=${{ vars.SENTRY_PROFILES_SAMPLE_RATE || '0.0' }}
            SENTRY_MAX_BREADCRUMBS=${{ vars.SENTRY_MAX_BREADCRUMBS || '50' }}
            SMS_BACKEND=${{ env.DEPLOY_ENV == 'production' && 'hmis.apps.core.sms.backends.AfricasTalkingSMSBackend' || 'hmis.apps.core.sms.backends.MockSMSBackend' }}
            SMS_SENDER_ID=VitoraHMIS
            PRICING_REQUIRE_SIGNED_NONCE=${{ env.DEPLOY_ENV == 'production' && 'true' || 'false' }}
            PRICING_NONCE_SECRET=secretref:pricing-nonce-secret
            PRICING_NONCE_TTL_SECONDS=${{ vars.PRICING_NONCE_TTL_SECONDS || '300' }}
            PRICING_QUOTE_CACHE_TTL_SECONDS=${{ vars.PRICING_QUOTE_CACHE_TTL_SECONDS || '120' }}
            PRICING_QUOTE_SNAPSHOT_TTL_DAYS=${{ vars.PRICING_QUOTE_SNAPSHOT_TTL_DAYS || '30' }}
            WEBAUTHN_RP_ID=${{ vars.WEBAUTHN_RP_ID || (env.DEPLOY_ENV == 'production' && 'app.vitora.digital' || 'staging.vitora.digital') }}
            WEBAUTHN_ORIGIN=${{ vars.WEBAUTHN_ORIGIN || (env.DEPLOY_ENV == 'production' && 'https://app.vitora.digital' || 'https://staging.vitora.digital') }}
            METABASE_SITE_URL=${{ vars.METABASE_SITE_URL || (env.DEPLOY_ENV == 'production' && 'https://metabase.vitora.digital' || 'https://metabase.staging.vitora.digital') }}
            METABASE_API_URL=${{ vars.METABASE_API_URL || 'http://vitora-metabase' }}
            METABASE_EMBEDDING_SECRET=secretref:metabase-embedding-secret
            METABASE_API_KEY=secretref:metabase-api-key
            SUPERSET_URL=${{ vars.SUPERSET_URL || '' }}
            SUPERSET_ADMIN_USERNAME=${{ vars.SUPERSET_ADMIN_USERNAME || 'admin' }}
            SUPERSET_ADMIN_PASSWORD=secretref:superset-admin-password
            RESEND_API_KEY=secretref:resend-api-key
            SLACK_SIGNUP_WEBHOOK_URL=secretref:slack-signup-webhook-url
            POWERSYNC_URL=${{ vars.POWERSYNC_URL || 'https://69d7e1b30e377e689729cf08.powersync.journeyapps.com' }}
            POWERSYNC_JWT_KID=vitora-hmis-1
            POWERSYNC_JWT_AUDIENCE=${{ vars.POWERSYNC_JWT_AUDIENCE || 'https://69d7e1b30e377e689729cf08.powersync.journeyapps.com' }}
            VAPID_PUBLIC_KEY=BK9Ze2ux8-t3w3r83bj7kOEcTuz3IfATjoyg5_TRYBVTAHaqvjRUHqpVHc6T0Ej0nbaDY5ZTVlJ7Mnle6h7ZesU
            VAPID_PRIVATE_KEY=secretref:vapid-private-key
            VAPID_CLAIM_EMAIL=mailto:info@nexora.africa
            LIS_STANDALONE_MODE=${{ vars.LIS_STANDALONE_MODE || 'false' }}
            PHARMACY_STANDALONE_MODE=${{ vars.PHARMACY_STANDALONE_MODE || 'false' }}
            IMAGING_STANDALONE_MODE=${{ vars.IMAGING_STANDALONE_MODE || 'false' }}
            INSURANCE_ENABLED=${{ vars.INSURANCE_ENABLED || 'false' }}
            DHIS2_BASE_URL=${{ vars.DHIS2_BASE_URL || '' }}
            DHIS2_USERNAME=secretref:dhis2-username
            DHIS2_PASSWORD=secretref:dhis2-password
            DHIS2_ORG_UNIT=${{ vars.DHIS2_ORG_UNIT || '' }}
            FACILITY_HAS_ICU=${{ vars.FACILITY_HAS_ICU || '' }}
            FACILITY_HAS_LABORATORY=${{ vars.FACILITY_HAS_LABORATORY || 'true' }}
            FACILITY_HAS_IMAGING=${{ vars.FACILITY_HAS_IMAGING || '' }}
            FACILITY_HAS_PHARMACY=${{ vars.FACILITY_HAS_PHARMACY || 'true' }}
            FACILITY_ADDRESS=${{ vars.FACILITY_ADDRESS || '' }}
            FACILITY_PHONE=${{ vars.FACILITY_PHONE || '' }}
            FACILITY_EMAIL=${{ vars.FACILITY_EMAIL || '' }}
            FACILITY_LICENSE=${{ vars.FACILITY_LICENSE || '' }}
            LICENSE_SIGNING_KEY=secretref:license-signing-key
            LOINC_USERNAME=secretref:loinc-username
            LOINC_PASSWORD=secretref:loinc-password

      - name: Run post-deploy maintenance
        run: |
          bash backend/scripts/aca-run-postdeploy.sh "${{ env.CONTAINER_APP_NAME }}" "${{ env.AZURE_RESOURCE_GROUP }}"
