name: Deploy Backend to Azure Container Apps

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: vitora-rg
  AZURE_LOCATION: eastus
  CONTAINER_APP_NAME: vitora-api
  CONTAINER_APP_ENV: vitora-env
  REGISTRY_NAME: vitoraacr
  IMAGE_NAME: vitora-api

jobs:
  build-and-deploy:
    name: Build & Deploy to ACA
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ env.REGISTRY_NAME }}

      - name: Build and push Docker image
        working-directory: backend
        run: |
          IMAGE_TAG="${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          IMAGE_LATEST="${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest"
          docker build -t "$IMAGE_TAG" -t "$IMAGE_LATEST" .
          docker push "$IMAGE_TAG"
          docker push "$IMAGE_LATEST"

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          containerAppEnvironment: ${{ env.CONTAINER_APP_ENV }}
          imageToDeploy: ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          targetPort: 8000
          ingress: external
          environmentVariables: >-
            DJANGO_SETTINGS_MODULE=hmis.settings.staging
            DATABASE_URL=secretref:database-url
            ENCRYPTION_KEY=secretref:encryption-key
            DJANGO_SECRET_KEY=secretref:django-secret-key
            ALLOWED_HOSTS=${{ vars.ALLOWED_HOSTS }}
            CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS }}
            CSRF_TRUSTED_ORIGINS=${{ vars.CSRF_TRUSTED_ORIGINS }}
            DEMO_MODE=true
            CELERY_TASK_ALWAYS_EAGER=true
            PORT=8000
            SHA_ENABLED=true
            SHA_API_BASE_URL=https://uat.dha.go.ke
            SHA_USERNAME=secretref:sha-username
            SHA_PASSWORD=secretref:sha-password
            SHA_CONSUMER_KEY=secretref:sha-consumer-key
            SHA_CLIENT_SECRET=secretref:sha-client-secret
            SHA_ENCRYPTED_PIN=secretref:sha-encrypted-pin
            SHA_AGENT=DHABP05113
            SHA_FHIR_BASE_URL=https://qa-mis.apeiro-digital.com
            SHA_API_TIMEOUT=30
            AT_API_KEY=secretref:at-api-key
            AT_USERNAME=sandbox
            KMS_PROVIDER=local
            TIBABOT_ENABLED=true
            TIBABOT_API_KEY=secretref:tibabot-api-key
            TIBABOT_API_URL=https://tibabot.vitora.nexora.africa
            MPESA_ENVIRONMENT=sandbox
            MPESA_CONSUMER_KEY=secretref:mpesa-consumer-key
            MPESA_CONSUMER_SECRET=secretref:mpesa-consumer-secret
            MPESA_SHORTCODE=174379
            MPESA_PASSKEY=secretref:mpesa-passkey
            MPESA_CALLBACK_URL=${{ vars.MPESA_CALLBACK_URL }}
