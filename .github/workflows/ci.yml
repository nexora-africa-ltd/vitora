name: CI/CD Pipeline

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main, develop, copilot/** ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Job 1: Backend Testing & Linting
  backend-tests:
    name: Backend Tests & Quality Gates
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pre-commit
            backend/.venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        working-directory: ./backend
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction --no-ansi
        if: hashFiles('backend/pyproject.toml') != ''

      - name: Run pre-commit (mandatory)
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
          pre-commit run --all-files
        continue-on-error: false

      - name: Run Ruff Linter
        working-directory: ./backend
        run: |
          if [ -f "pyproject.toml" ]; then
            poetry run ruff check . --output-format=github
          else
            echo "⏭️  Skipping: No backend code yet"
          fi
        continue-on-error: false

      - name: Run Ruff Formatter Check
        working-directory: ./backend
        run: |
          if [ -f "pyproject.toml" ]; then
            poetry run ruff format --check .
          else
            echo "⏭️  Skipping: No backend code yet"
          fi
        continue-on-error: false

      - name: Run Pytest with Coverage
        working-directory: ./backend
        run: |
          if [ -f "pyproject.toml" ] && [ -d "tests" ]; then
            poetry run pytest --cov=hmis --cov-report=xml --cov-report=term --cov-fail-under=80
          else
            echo "⏭️  Skipping: No tests yet"
          fi
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
        if: hashFiles('backend/coverage.xml') != ''
        continue-on-error: true

      - name: Run mypy Type Checking
        working-directory: ./backend
        run: |
          if [ -f "pyproject.toml" ]; then
            poetry run mypy hmis --ignore-missing-imports || echo "⚠️  Type checking has warnings"
          else
            echo "⏭️  Skipping: No backend code yet"
          fi
        continue-on-error: true
        if: hashFiles('backend/hmis') != ''

  # Job 2: Security Scanning
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit Security Scan
        run: |
          if [ -d "backend/hmis" ]; then
            bandit -r backend/hmis -f json -o bandit-report.json || true
            bandit -r backend/hmis
          else
            echo "⏭️  Skipping: No backend code yet"
          fi
        continue-on-error: true

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json
        if: hashFiles('bandit-report.json') != ''
        continue-on-error: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
        if: hashFiles('trivy-results.sarif') != '' && github.event_name != 'pull_request'
        continue-on-error: true

  # Job 3: Frontend Testing & Linting
  frontend-tests:
    name: Frontend Tests & Quality Gates
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['20.x']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: web-app/package-lock.json
        if: hashFiles('web-app/package.json') != ''

      - name: Install Frontend Dependencies
        working-directory: ./web-app
        run: npm ci
        if: hashFiles('web-app/package.json') != ''

      - name: Run ESLint
        working-directory: ./web-app
        run: npm run lint
        if: hashFiles('web-app/package.json') != ''
        continue-on-error: true

      - name: Run Frontend Tests
        working-directory: ./web-app
        run: npm test -- --coverage --watchAll=false
        if: hashFiles('web-app/package.json') != ''
        continue-on-error: true

  # Job 4: Documentation Check
  documentation-check:
    name: Documentation Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check README exists
        run: |
          if [ ! -f "README.md" ]; then
            echo "❌ README.md not found"
            exit 1
          fi
          echo "✅ README.md exists"

      - name: Check ROADMAP exists
        run: |
          if [ ! -f "ROADMAP.md" ]; then
            echo "⚠️  ROADMAP.md not found"
          else
            echo "✅ ROADMAP.md exists"
          fi

      - name: Check docs directory
        run: |
          if [ ! -d "docs" ]; then
            echo "⚠️  docs/ directory not found"
          else
            echo "✅ docs/ directory exists"
            ls -la docs/
          fi

      - name: Markdown Lint
        uses: nosborn/github-action-markdown-cli@v3.3.0
        with:
          files: .
          config_file: ".markdownlint.json"
        continue-on-error: true

  # Job 5: Build Validation
  build-validation:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Project Structure
        run: |
          echo "Validating project structure..."

          # Check for required directories (may not exist yet in Phase 0)
          for dir in backend web-app desktop-app mobile-app infrastructure docs; do
            if [ -d "$dir" ]; then
              echo "✅ $dir/ exists"
            else
              echo "⏭️  $dir/ not yet created (expected in early phases)"
            fi
          done

          # Check for documentation
          if [ -f "README.md" ]; then
            echo "✅ README.md exists"
          else
            echo "❌ README.md missing"
            exit 1
          fi

      - name: Check for TODOs and FIXMEs
        run: |
          echo "Scanning for TODO and FIXME comments..."
          if git grep -n "TODO\|FIXME" -- '*.py' '*.js' '*.ts' '*.tsx' || true; then
            echo "⚠️  Found TODO/FIXME items (informational only)"
          else
            echo "✅ No TODO/FIXME items found"
          fi
        continue-on-error: true

  # Job 6: Test Coverage Report
  coverage-report:
    name: Generate Coverage Report
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true

      - name: Coverage Summary
        run: |
          echo "📊 Coverage Summary"
          echo "==================="
          echo ""
          echo "Backend Coverage: Check backend-tests job for details"
          echo "Frontend Coverage: Check frontend-tests job for details"
          echo ""
          echo "Target: ≥80% coverage as per TDD requirements"
          echo ""
          echo "Note: Full coverage reporting will be available once tests are implemented"

  # Job 7: Quality Gate
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [backend-tests, security-scan, frontend-tests, documentation-check]
    if: always()

    steps:
      - name: Check Job Status
        run: |
          echo "🎯 Quality Gate Status"
          echo "======================"
          echo ""
          echo "Backend Tests: ${{ needs.backend-tests.result }}"
          echo "Security Scan: ${{ needs.security-scan.result }}"
          echo "Frontend Tests: ${{ needs.frontend-tests.result }}"
          echo "Documentation: ${{ needs.documentation-check.result }}"
          echo ""

          # In Phase 0, we allow some jobs to be skipped
          if [ "${{ needs.backend-tests.result }}" == "failure" ]; then
            echo "❌ Backend tests failed"
            exit 1
          fi

          if [ "${{ needs.security-scan.result }}" == "failure" ]; then
            echo "⚠️  Security scan had issues (non-blocking in Phase 0)"
          fi

          echo "✅ Quality gate passed (Phase 0 criteria)"
