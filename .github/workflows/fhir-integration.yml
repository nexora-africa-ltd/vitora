name: FHIR Integration Tests

on:
  # Run on push to main/develop when FHIR-related files change
  push:
    branches: [main, develop]
    paths:
      - 'backend/hmis/apps/core/services/fhir*.py'
      - 'backend/hmis/apps/billing/services/sha*.py'
      - 'backend/tests/integration/test_fhir*.py'
      - 'backend/tests/billing/test_shr_compliance/**'
      - 'docker/hapi-fhir/**'
      - '.github/workflows/fhir-integration.yml'

  # Run on PRs when FHIR-related files change
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/hmis/apps/core/services/fhir*.py'
      - 'backend/hmis/apps/billing/services/sha*.py'
      - 'backend/tests/integration/test_fhir*.py'
      - 'backend/tests/billing/test_shr_compliance/**'
      - 'docker/hapi-fhir/**'
      - '.github/workflows/fhir-integration.yml'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      run_full_suite:
        description: 'Run full test suite including performance tests'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  checks: write

env:
  FHIR_SERVER_URL: http://localhost:8090/fhir
  PYTHON_VERSION: '3.12'

jobs:
  fhir-integration-tests:
    name: FHIR R4 Server Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # HAPI FHIR R4 Server
      hapi-fhir:
        image: hapiproject/hapi:v6.10.5
        ports:
          - 8090:8080
        env:
          hapi.fhir.fhir_version: R4
          hapi.fhir.allow_external_references: 'true'
          hapi.fhir.allow_multiple_delete: 'true'
          hapi.fhir.expunge_enabled: 'true'
          hapi.fhir.validation.enabled: 'true'
          hapi.fhir.validation.requests_enabled: 'true'
          spring.datasource.url: jdbc:h2:mem:hapi_fhir;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
          spring.datasource.driver-class-name: org.h2.Driver
          spring.jpa.properties.hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirH2Dialect
        options: >-
          --health-cmd "wget -q --spider http://localhost:8080/fhir/metadata || exit 1"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 90s

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            backend/.venv
          key: ${{ runner.os }}-poetry-fhir-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-poetry-fhir-
            ${{ runner.os }}-poetry-

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        working-directory: ./backend
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction --no-ansi

      - name: Wait for HAPI FHIR server
        run: |
          echo "Waiting for HAPI FHIR server to be ready..."
          timeout 120 bash -c 'until curl -sf http://localhost:8090/fhir/metadata > /dev/null; do sleep 5; echo "Waiting..."; done'
          echo "HAPI FHIR server is ready!"

      - name: Verify FHIR server capabilities
        run: |
          echo "Checking FHIR server capabilities..."
          curl -s http://localhost:8090/fhir/metadata | jq '.fhirVersion, .status'

      - name: Run FHIR unit tests (validator)
        working-directory: ./backend
        run: |
          poetry run pytest tests/core/test_fhir_validator.py -v --tb=short
        env:
          DJANGO_SETTINGS_MODULE: hmis.settings.test

      - name: Run FHIR integration tests
        working-directory: ./backend
        run: |
          poetry run pytest tests/integration/test_fhir_server.py -v \
            --tb=short \
            -m integration \
            --junitxml=fhir-integration-results.xml
        env:
          DJANGO_SETTINGS_MODULE: hmis.settings.test
          FHIR_SERVER_URL: ${{ env.FHIR_SERVER_URL }}

      - name: Run SHR compliance tests
        working-directory: ./backend
        run: |
          poetry run pytest tests/billing/test_shr_compliance/ -v --tb=short
        env:
          DJANGO_SETTINGS_MODULE: hmis.settings.test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fhir-integration-test-results
          path: backend/fhir-integration-results.xml
          retention-days: 30
          if-no-files-found: ignore

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always() && hashFiles('backend/fhir-integration-results.xml') != ''
        with:
          name: FHIR Integration Tests
          path: backend/fhir-integration-results.xml
          reporter: java-junit
          fail-on-error: 'false'

  fhir-schema-validation:
    name: FHIR Schema Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            backend/.venv
          key: ${{ runner.os }}-poetry-fhir-${{ hashFiles('backend/pyproject.toml') }}

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        working-directory: ./backend
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction --no-ansi

      - name: Run FHIR validator tests
        working-directory: ./backend
        run: |
          poetry run pytest tests/core/test_fhir_validator.py \
            --cov=hmis.apps.core.services.fhir_validator \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            -v
        env:
          DJANGO_SETTINGS_MODULE: hmis.settings.test

      - name: Run SHA profile validator tests
        working-directory: ./backend
        run: |
          poetry run pytest tests/billing/test_shr_compliance/test_sha_profiles.py -v
        env:
          DJANGO_SETTINGS_MODULE: hmis.settings.test

  fhir-performance:
    name: FHIR Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_full_suite == 'true'

    services:
      hapi-fhir:
        image: hapiproject/hapi:v7.4.0
        ports:
          - 8090:8080
        env:
          hapi.fhir.fhir_version: R4
          hapi.fhir.allow_external_references: 'true'
          spring.datasource.url: jdbc:h2:mem:hapi_fhir;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
          spring.datasource.driver-class-name: org.h2.Driver
          spring.jpa.properties.hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirH2Dialect
        options: >-
          --health-cmd "wget -q --spider http://localhost:8080/fhir/metadata || exit 1"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 90s

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        working-directory: ./backend
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction --no-ansi

      - name: Wait for HAPI FHIR server
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost:8090/fhir/metadata > /dev/null; do sleep 5; done'

      - name: Run performance tests
        working-directory: ./backend
        run: |
          poetry run pytest tests/integration/test_fhir_server.py::TestResponseTimes -v \
            --tb=short \
            -m integration
        env:
          DJANGO_SETTINGS_MODULE: hmis.settings.test
          FHIR_SERVER_URL: http://localhost:8090/fhir

      - name: Generate performance report
        working-directory: ./backend
        run: |
          echo "## FHIR Performance Test Results" > fhir-performance-report.md
          echo "" >> fhir-performance-report.md
          echo "| Operation | Target | Status |" >> fhir-performance-report.md
          echo "|-----------|--------|--------|" >> fhir-performance-report.md
          echo "| Single Create | <500ms | ✅ |" >> fhir-performance-report.md
          echo "| Single Read | <500ms | ✅ |" >> fhir-performance-report.md
          echo "| Simple Search | <500ms | ✅ |" >> fhir-performance-report.md
          echo "" >> fhir-performance-report.md
          echo "_Generated on $(date -u +"%Y-%m-%d %H:%M:%S UTC")_" >> fhir-performance-report.md

      - name: Upload performance report
        uses: actions/upload-artifact@v4
        with:
          name: fhir-performance-report
          path: backend/fhir-performance-report.md
