# Deploys the production-only Superset service to South Africa North.
#
# Use: push a superset-v* tag or run this workflow manually. It delegates image
# build, deploy-time migrations, rollout, and health validation to
# backend/scripts/deploy-superset-sa.sh.
name: Deploy Superset

on:
  push:
    tags:
      - "superset-v*"
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: vitora-rg-sa
  CONTAINER_APP_NAME: vitora-superset-sa
  CONTAINER_APP_ENV: vitora-env-private-sa
  CONTAINER_APP_JOB: vitora-superset-migrate-sa
  REGISTRY_NAME: vitoraacrsa
  EXPECTED_AZURE_SUBSCRIPTION_ID: b7dc0a20-1bad-484b-bd8a-c22e7698bdd3

jobs:
  deploy:
    name: Build, migrate, and deploy Superset
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_SA_CLIENT_ID != '' && secrets.AZURE_SA_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_SA_TENANT_ID != '' && secrets.AZURE_SA_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SA_SUBSCRIPTION_ID != '' && secrets.AZURE_SA_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure deployment subscription
        run: |
          ACTUAL_SUBSCRIPTION_ID=$(az account show --query id --output tsv)
          if [ "$ACTUAL_SUBSCRIPTION_ID" != "${{ env.EXPECTED_AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "ERROR: Expected subscription ${{ env.EXPECTED_AZURE_SUBSCRIPTION_ID }}, got $ACTUAL_SUBSCRIPTION_ID." >&2
            exit 1
          fi

      - name: Build, migrate, deploy, and health-check
        working-directory: backend
        env:
          SS_ASSUME_YES: "1"
          DEPLOY_TAG: ${{ github.sha }}
          ACA_RG: ${{ env.AZURE_RESOURCE_GROUP }}
          ACA_ENV: ${{ env.CONTAINER_APP_ENV }}
          ACA_NAME: ${{ env.CONTAINER_APP_NAME }}
          ACA_JOB: ${{ env.CONTAINER_APP_JOB }}
          ACR_NAME: ${{ env.REGISTRY_NAME }}
        run: bash scripts/deploy-superset-sa.sh
