# DHIS2 Configuration File
# See: https://docs.dhis2.org/en/manage/performing-system-administration/dhis-core-version-240/installation.html

# Database connection
connection.dialect = org.hibernate.dialect.PostgreSQLDialect
connection.driver_class = org.postgresql.Driver
connection.url = jdbc:postgresql://db:5432/dhis2
connection.username = dhis
connection.password = dhis

# Connection pool
connection.pool.max_size = 80

# Server settings
server.base.url = http://localhost:8082
