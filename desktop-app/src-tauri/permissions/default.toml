# This file defines app-command ACL permissions for the Tauri desktop shell.
# Used automatically by Tauri capabilities to allow frontend invoke commands.
# Inputs: command names registered in src/lib.rs via tauri::generate_handler!.

[[set]]
identifier = "default"
description = "Default permissions for Vitora desktop app commands."
permissions = [
  "allow-get-sidecar-port",
  "allow-get-app-version",
  "allow-print-receipt",
  "allow-list-printers",
  "allow-get-api-url",
  "allow-set-api-url",
  "allow-is-first-run",
  "allow-get-app-config",
  "allow-set-deployment-mode",
  "allow-set-sync-interval",
  "allow-set-backup-interval",
  "allow-set-hub-url",
  "allow-set-facility-id",
  "allow-set-organization-id",
  "allow-save-hub-config",
  "allow-get-db-encryption-key",
  "allow-set-fernet-key",
  "allow-get-fernet-key",
  "allow-get-installation-id",
  "allow-store-license-token",
  "allow-get-license-token",
  "allow-clear-license-token",
  "allow-store-credentials",
  "allow-get-credentials",
  "allow-clear-credentials",
  "allow-check-for-updates",
]

[[permission]]
identifier = "allow-get-sidecar-port"
commands.allow = ["get_sidecar_port"]

[[permission]]
identifier = "allow-get-app-version"
commands.allow = ["get_app_version"]

