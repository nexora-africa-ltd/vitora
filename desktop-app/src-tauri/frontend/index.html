      height: 100vh;

      animation: pulse 2s ease-in-out infinite;

      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 32px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      margin: 0 auto;
      border: 3px solid #1e293b;
      border-top-color: #06b6d4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status {
      margin-top: 16px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
