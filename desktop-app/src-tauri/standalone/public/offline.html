<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4e0b18" />
    <title>Vitora HMIS Offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(21, 96, 115, 0.18), transparent 38%),
          linear-gradient(160deg, #f8f5f2 0%, #fffdfb 45%, #f4f7f8 100%);
        color: #1f2937;
      }

      main {
        width: min(32rem, calc(100vw - 2rem));
        padding: 2rem;
        border: 1px solid rgba(78, 11, 24, 0.12);
        border-radius: 1.5rem;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 18px 60px rgba(78, 11, 24, 0.12);
      }

      .eyebrow {
        margin: 0 0 0.75rem;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #4e0b18;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.75rem, 4vw, 2.4rem);
        line-height: 1.05;
      }

      p {
        margin: 1rem 0 0;
        line-height: 1.6;
        color: #475569;
      }

      strong {
        color: #0f172a;
      }

      button {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 1.25rem;
        padding: 0.625rem 1.25rem;
        border: 1px solid rgba(78, 11, 24, 0.2);
        border-radius: 0.75rem;
        background: #4e0b18;
        color: #fff;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.15s;
      }
      button:hover { opacity: 0.85; }
      button:active { opacity: 0.7; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Vitora HMIS</p>
      <h1>You are offline.</h1>
      <p><strong>This page hasn&rsquo;t been cached yet.</strong> Pages you&rsquo;ve visited before will continue to work offline with locally stored clinical data.</p>
      <p>Connect to the internet and visit this page once &mdash; it will be available offline from then on.</p>
      <button onclick="location.reload()">&#8635; Try again</button>
    </main>
  </body>
</html>
