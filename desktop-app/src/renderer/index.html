<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
  <title>Vitora HMIS - Hospital Management</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Login Container -->
  <div id="login-container" class="login-container">
    <div class="login-box">
      <div class="login-header">
        <h1><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ee44a7" stroke-width="0.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-heart-pulse-icon lucide-heart-pulse"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/><path d="M3.22 13H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/></svg> Vitora HMIS</h1>
        <p class="subtitle">Reliable Healthcare, Anywhere</p>
      </div>
      
      <form id="login-form">
        <div class="form-group">
          <label for="login-username">Username</label>
          <input type="text" id="login-username" name="username" required 
                 placeholder="Enter your username" autocomplete="username">
        </div>
        
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" required 
                 placeholder="Enter your password" autocomplete="current-password">
        </div>
        
        <div id="login-error" class="login-error" style="display: none;"></div>
        
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">
          <span id="login-btn-text">Sign In</span>
          <span id="login-spinner" class="spinner" style="display: none;"></span>
        </button>
      </form>
      
      <div class="login-footer">
        <p>Kenya Data Protection Act 2019 Compliant</p>
      </div>
    </div>
  </div>

  <!-- Main Application Container (hidden until login) -->
  <div id="main-container" class="container" style="display: none;">
    <header>
      <div class="header-content">
        <div class="header-left">
          <h1><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ee44a7" stroke-width="0.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-heart-pulse-icon lucide-heart-pulse"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/><path d="M3.22 13H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/></svg> Vitora HMIS</h1>
          <p class="subtitle">Reliable Healthcare, Anywhere</p>
        </div>
        <div class="header-right">
          <div class="theme-toggle">
            <button id="theme-toggle-btn" class="theme-toggle-btn" title="Toggle dark mode">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eclipse-icon lucide-eclipse"><circle cx="12" cy="12" r="10"/><path d="M12 2a7 7 0 1 0 10 10"/></svg>
            </button>
          </div>
          <div id="offline-indicator" class="offline-indicator" style="display: none;">
            <span class="offline-dot"></span>
            <span>Offline Mode</span>
          </div>
          <div class="user-info">
            <span id="current-user" class="current-user"></span>
            <button id="logout-btn" class="btn btn-secondary btn-sm">Logout</button>
          </div>
        </div>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="register">Register Patient</button>
      <button class="tab" data-tab="list">Patient List</button>
      <button class="tab" data-tab="encounter">New Encounter</button>
    </nav>

    <!-- Patient Registration Form -->
    <div id="register-tab" class="tab-content active">
      <h2>Patient Registration</h2>
      
      <form id="patient-form">
        <div class="form-row">
          <div class="form-group">
            <label for="first-name">First Name *</label>
            <input type="text" id="first-name" name="first_name" required>
          </div>
          
          <div class="form-group">
            <label for="middle-name">Middle Name</label>
            <input type="text" id="middle-name" name="middle_name">
          </div>
          
          <div class="form-group">
            <label for="last-name">Last Name *</label>
            <input type="text" id="last-name" name="last_name" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="date-of-birth">Date of Birth *</label>
            <input type="date" id="date-of-birth" name="date_of_birth" required>
          </div>
          
          <div class="form-group">
            <label for="gender">Gender *</label>
            <select id="gender" name="gender" required>
              <option value="">Select...</option>
              <option value="M">Male</option>
              <option value="F">Female</option>
              <option value="O">Other</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="phone-number">Phone Number</label>
            <input type="tel" id="phone-number" name="phone_number" placeholder="+254712345678">
          </div>
          
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="patient@example.com">
          </div>
        </div>

        <div class="form-group">
          <label for="national-id">National ID</label>
          <input type="text" id="national-id" name="national_id">
        </div>

        <div class="form-group">
          <label for="address">Address</label>
          <textarea id="address" name="address" rows="3" placeholder="Patient's physical address"></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submit-btn">
            Register Patient
          </button>
          <button type="button" class="btn btn-secondary" id="clear-btn">
            Clear Form
          </button>
        </div>
      </form>

      <div id="message" class="message" style="display: none;"></div>
    </div>

    <!-- Patient List -->
    <div id="list-tab" class="tab-content">
      <h2>Patient List</h2>
      
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search by name, MRN, or phone...">
        <button class="btn btn-primary" id="search-btn">Search</button>
      </div>

      <div id="patient-list" class="patient-list">
        <p class="loading">Loading patients...</p>
      </div>
    </div>

    <!-- New Encounter Tab -->
    <div id="encounter-tab" class="tab-content">
      <h2>New Encounter</h2>
      
      <!-- Patient Selection -->
      <div class="patient-selection">
        <div class="form-group">
          <label for="patient-search">Select Patient *</label>
          <div class="search-bar">
            <input type="text" id="patient-search" placeholder="Search patient by name or MRN...">
            <button class="btn btn-primary" id="patient-search-btn">Search</button>
          </div>
        </div>
        <div id="patient-search-results" class="patient-search-results"></div>
        <div id="selected-patient" class="selected-patient" style="display: none;">
          <div class="selected-patient-info">
            <strong id="selected-patient-name"></strong>
            <span id="selected-patient-mrn" class="mrn"></span>
          </div>
          <button class="btn btn-secondary btn-sm" id="change-patient-btn">Change</button>
        </div>
      </div>

      <!-- Encounter Form -->
      <form id="encounter-form" style="display: none;">
        <h3>Encounter Details</h3>
        
        <div class="form-row">
          <div class="form-group">
            <label for="encounter-type">Encounter Type *</label>
            <select id="encounter-type" name="encounter_type" required>
              <option value="">Select...</option>
              <option value="OPD">Outpatient (OPD)</option>
              <option value="EMERGENCY">Emergency</option>
              <option value="INPATIENT">Inpatient</option>
            </select>
          </div>
          
          <div class="form-group">
            <label for="encounter-date">Date *</label>
            <input type="date" id="encounter-date" name="encounter_date" required>
          </div>
        </div>

        <div class="form-group">
          <label for="chief-complaint">Chief Complaint *</label>
          <textarea id="chief-complaint" name="chief_complaint" rows="3" required 
                    placeholder="Describe the patient's main complaint..."></textarea>
        </div>

        <h3>Vital Signs</h3>
        <div class="vitals-section">
          <div class="form-row">
            <div class="form-group">
              <label for="temperature">Temperature (°C)</label>
              <input type="number" id="temperature" name="temperature" step="0.1" min="30" max="45" placeholder="37.0">
            </div>
            
            <div class="form-group">
              <label for="pulse">Pulse (bpm)</label>
              <input type="number" id="pulse" name="pulse" min="30" max="200" placeholder="75">
            </div>
            
            <div class="form-group">
              <label for="respiratory-rate">Respiratory Rate</label>
              <input type="number" id="respiratory-rate" name="respiratory_rate" min="5" max="60" placeholder="16">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="blood-pressure">Blood Pressure (mmHg)</label>
              <input type="text" id="blood-pressure" name="blood_pressure" placeholder="120/80">
            </div>
            
            <div class="form-group">
              <label for="weight">Weight (kg)</label>
              <input type="number" id="weight" name="weight" step="0.1" min="0" max="500" placeholder="70.0">
            </div>
            
            <div class="form-group">
              <label for="height">Height (cm)</label>
              <input type="number" id="height" name="height" step="0.1" min="0" max="300" placeholder="170.0">
            </div>
          </div>

          <div id="bmi-display" class="bmi-display" style="display: none;">
            <span class="label">Calculated BMI:</span>
            <span id="bmi-value" class="value"></span>
            <span id="bmi-category" class="bmi-category"></span>
          </div>
        </div>

        <h3>Clinical Notes</h3>
        <div class="form-group">
          <label for="notes">Notes</label>
          <textarea id="notes" name="notes" rows="4" placeholder="Additional clinical observations..."></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="encounter-submit-btn">
            Save Encounter
          </button>
          <button type="button" class="btn btn-secondary" id="encounter-clear-btn">
            Clear Form
          </button>
        </div>
      </form>

      <div id="encounter-message" class="message" style="display: none;"></div>
    </div>

    <!-- Patient Details Modal -->
    <div id="patient-modal" class="modal" style="display: none;">
      <div class="modal-content">
        <span class="close-modal">&times;</span>
        <div id="patient-modal-content">
          <!-- Patient details will be loaded here -->
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
