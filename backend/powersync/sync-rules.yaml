# =============================================================================
# PowerSync Sync Rules for Vitora HMIS
# =============================================================================
# These rules define what data syncs to each connected client.
# Data is scoped by facility_id from the JWT token parameters.
#
# SECURITY NOTES:
# - Encrypted fields (national_id, phone_number) are EXCLUDED from sync.
#   They remain API-only to comply with Kenya DPA 2019.
# - Sensitive patients (is_sensitive=true) require view_sensitive_patient
#   permission — handled at the API layer, not here.
# - Facility scoping ensures tenant isolation.
#
# Documentation: https://docs.powersync.com/usage/sync-rules
# =============================================================================

bucket_definitions:
  # ───────────────────────────────────────────────────────────────────────────
  # Global reference data — synced to ALL authenticated users (read-only)
  # ───────────────────────────────────────────────────────────────────────────
  global_counties:
    # Kenya location hierarchy — 47 counties, ~289 sub-counties, ~1448 wards
    # Small dataset, rarely changes. Sync once, query locally forever.
    parameters: SELECT token_parameters.user_id AS user_id
    data:
      - SELECT id, code, name FROM core_county

  global_sub_counties:
    parameters: SELECT token_parameters.user_id AS user_id
    data:
      - SELECT id, county_id, name FROM core_subcounty

  global_wards:
    parameters: SELECT token_parameters.user_id AS user_id
    data:
      - SELECT id, sub_county_id, name FROM core_ward

  # ───────────────────────────────────────────────────────────────────────────
  # Organization-scoped data — synced to users in the same organization
  # ───────────────────────────────────────────────────────────────────────────
  org_patients:
    # Patients are organization-scoped (visible across all org facilities).
    # EXCLUDES: national_id, phone_number, identification_number (encrypted/PII)
    parameters: SELECT token_parameters.organization_id AS org_id
    data:
      - >
        SELECT
          id,
          organization_id,
          registered_at_facility_id,
          mrn,
          first_name,
          middle_name,
          last_name,
          title,
          date_of_birth,
          gender,
          cr_number,
          sha_number,
          email,
          address,
          citizenship,
          identification_type,
          is_person_with_disability,
          is_sensitive,
          consent_given,
          consent_date,
          consent_deferred,
          registered_by_id,
          referral_source,
          referred_from_facility,
          county_id,
          sub_county_id,
          ward_id,
          is_deceased,
          created_at,
          updated_at
        FROM patients_patient
        WHERE organization_id = bucket.org_id

  # ───────────────────────────────────────────────────────────────────────────
  # Facility-scoped data — synced only to users at the same facility
  # ───────────────────────────────────────────────────────────────────────────
  facility_encounters:
    parameters: SELECT token_parameters.facility_id AS fac_id
    data:
      - >
        SELECT
          id,
          organization_id,
          facility_id,
          patient_id,
          clinic_visit_id,
          encounter_type,
          encounter_date,
          chief_complaint,
          temperature,
          pulse,
          blood_pressure,
          respiratory_rate,
          spo2,
          weight,
          height,
          notes,
          triage_requirement,
          triage_status,
          consultation_status,
          created_by_id,
          created_at,
          updated_at
        FROM encounters_encounter
        WHERE facility_id = bucket.fac_id

  facility_emergency_contacts:
    # Emergency contacts for patients in the organization
    # Synced per-facility via the patient's organization
    parameters: SELECT token_parameters.organization_id AS org_id
    data:
      - >
        SELECT
          ec.id,
          ec.patient_id,
          ec.full_name,
          ec.relationship,
          ec.phone_number,
          ec.alternative_phone,
          ec.created_at,
          ec.updated_at
        FROM patients_emergencycontact ec
        INNER JOIN patients_patient p ON ec.patient_id = p.id
        WHERE p.organization_id = bucket.org_id

  # ───────────────────────────────────────────────────────────────────────────
  # Phase 2: Clinical workflow tables
  # ───────────────────────────────────────────────────────────────────────────

  global_icd10_codes:
    # ICD-10 diagnosis codes — global reference data (~70k codes)
    # Synced once, queried locally for diagnosis search.
    parameters: SELECT token_parameters.user_id AS user_id
    data:
      - >
        SELECT
          id,
          code,
          short_description,
          description,
          long_description,
          category,
          chapter,
          is_billable,
          is_active
        FROM encounters_icd10code
        WHERE is_active = true

  global_clinical_templates:
    # Clinical templates for treatment plans — global reference data
    parameters: SELECT token_parameters.user_id AS user_id
    data:
      - >
        SELECT
          id,
          name,
          template_type,
          specialty,
          description,
          content,
          is_system,
          is_active,
          usage_count,
          created_by_id,
          created_at,
          updated_at
        FROM clinical_templates_clinicaltemplate
        WHERE is_active = true

  facility_triage:
    # Triage assessments — facility-scoped
    parameters: SELECT token_parameters.facility_id AS fac_id
    data:
      - >
        SELECT
          id,
          organization_id,
          facility_id,
          encounter_id,
          chief_complaint,
          chief_complaint_category,
          pain_score,
          mental_status,
          gcs_eye,
          gcs_verbal,
          gcs_motor,
          mobility,
          arrival_mode,
          referring_facility_name,
          allergies_noted,
          spo2,
          heart_rate,
          systolic_bp,
          diastolic_bp,
          temperature,
          respiratory_rate,
          weight,
          height,
          triage_category,
          auto_calculated_category,
          category_override_reason,
          assigned_area,
          assigned_clinic_id,
          assigned_clinician_id,
          arrival_time,
          triage_start_time,
          triage_end_time,
          seen_by_clinician_time,
          alerts,
          triaged_by_id,
          created_at,
          updated_at
        FROM triage_triageassessment
        WHERE facility_id = bucket.fac_id

  facility_diagnoses:
    # Diagnoses — scoped via encounter's facility
    parameters: SELECT token_parameters.facility_id AS fac_id
    data:
      - >
        SELECT
          d.id,
          d.encounter_id,
          d.icd10_code_id,
          d.icd11_code,
          d.icd11_display,
          d.snomed_code,
          d.snomed_display,
          d.diagnosis_type,
          d.free_text_diagnosis,
          d.notes,
          d.is_confirmed,
          d.certainty,
          d.diagnosed_by_id,
          d.diagnosed_at,
          d.created_at,
          d.updated_at
        FROM encounters_diagnosis d
        INNER JOIN encounters_encounter e ON d.encounter_id = e.id
        WHERE e.facility_id = bucket.fac_id

  facility_treatment_plans:
    # Treatment plans — scoped via encounter's facility
    parameters: SELECT token_parameters.facility_id AS fac_id
    data:
      - >
        SELECT
          tp.id,
          tp.encounter_id,
          tp.template_id,
          tp.medications_json,
          tp.procedures_json,
          tp.clinical_notes,
          tp.follow_up_instructions,
          tp.follow_up_date,
          tp.diet_recommendations,
          tp.activity_restrictions,
          tp.referral_needed,
          tp.referral_specialty,
          tp.referral_notes,
          tp.status,
          tp.created_by_id,
          tp.approved_by_id,
          tp.created_at,
          tp.updated_at
        FROM encounters_treatmentplan tp
        INNER JOIN encounters_encounter e ON tp.encounter_id = e.id
        WHERE e.facility_id = bucket.fac_id

  facility_medications:
    # Medications — scoped via treatment_plan → encounter → facility
    parameters: SELECT token_parameters.facility_id AS fac_id
    data:
      - >
        SELECT
          m.id,
          m.treatment_plan_id,
          m.name,
          m.dosage,
          m.frequency,
          m.duration,
          m.route,
          m.quantity,
          m.instructions,
          m.start_date,
          m.end_date,
          m.created_at,
          m.updated_at
        FROM encounters_medication m
        INNER JOIN encounters_treatmentplan tp ON m.treatment_plan_id = tp.id
        INNER JOIN encounters_encounter e ON tp.encounter_id = e.id
        WHERE e.facility_id = bucket.fac_id

  # ───────────────────────────────────────────────────────────────────────────
  # Phase 3: Pharmacy, Laboratory, Billing tables
  # ───────────────────────────────────────────────────────────────────────────

  facility_prescriptions:
    # Prescriptions — facility-scoped
    parameters: SELECT token_parameters.facility_id AS fac_id
    data:
      - >
        SELECT
          id,
          prescription_number,
          organization_id,
          facility_id,
          encounter_id,
          admission_id,
          patient_id,
          prescribed_by_id,
          prescribed_at,
          valid_until,
          status,
          dispensing_type,
          is_discharge_medication,
          clinical_notes,
          created_at,
          updated_at
        FROM pharmacy_prescription
        WHERE facility_id = bucket.fac_id

  facility_prescription_items:
    # Prescription line items — scoped via prescription → facility
    parameters: SELECT token_parameters.facility_id AS fac_id
    data:
      - >
        SELECT
          pi.id,
          pi.prescription_id,
          pi.drug_id,
          pi.quantity,
          pi.dosage,
          pi.frequency,
          pi.duration,
          pi.route,
          pi.instructions,
          pi.quantity_dispensed,
          pi.is_substitutable,
          pi.is_cancelled,
          pi.cancellation_reason,
          pi.created_at,
          pi.updated_at
        FROM pharmacy_prescriptionitem pi
        INNER JOIN pharmacy_prescription p ON pi.prescription_id = p.id
        WHERE p.facility_id = bucket.fac_id

  facility_lab_orders:
    # Lab orders — facility-scoped
    parameters: SELECT token_parameters.facility_id AS fac_id
    data:
      - >
        SELECT
          id,
          order_number,
          organization_id,
          facility_id,
          patient_id,
          encounter_id,
          admission_id,
          ordered_by_id,
          order_type,
          priority,
          clinical_notes,
          status,
          status_changed_at,
          status_changed_by_id,
          specimen_collected,
          specimen_collected_at,
          specimen_collected_by_id,
          sample_type,
          total_cost,
          is_paid,
          ordered_at,
          completed_at,
          created_at,
          updated_at
        FROM laboratory_laborder
        WHERE facility_id = bucket.fac_id

  facility_lab_order_items:
    # Lab order line items — scoped via lab_order → facility
    parameters: SELECT token_parameters.facility_id AS fac_id
    data:
      - >
        SELECT
          li.id,
          li.lab_order_id,
          li.test_id,
          li.status,
          li.unit_cost,
          li.special_instructions,
          li.created_at,
          li.updated_at
        FROM laboratory_laborderitem li
        INNER JOIN laboratory_laborder lo ON li.lab_order_id = lo.id
        WHERE lo.facility_id = bucket.fac_id

  facility_lab_results:
    # Lab results — scoped via order_item → lab_order → facility
    # EXCLUDES: FileField (external_result_attachment) — binary data not synced
    parameters: SELECT token_parameters.facility_id AS fac_id
    data:
      - >
        SELECT
          lr.id,
          lr.order_item_id,
          lr.specimen_id,
          lr.numeric_value,
          lr.text_value,
          lr.option_value,
          lr.result_unit,
          lr.reference_low,
          lr.reference_high,
          lr.reference_range_text,
          lr.result_flag,
          lr.interpretation,
          lr.is_critical_result,
          lr.method,
          lr.equipment,
          lr.verification_status,
          lr.verified_by_id,
          lr.verified_at,
          lr.entered_by_id,
          lr.entered_at,
          lr.is_amended,
          lr.amendment_reason,
          lr.original_value,
          lr.amended_by_id,
          lr.amended_at,
          lr.is_external_result,
          lr.external_result_date,
          lr.created_at,
          lr.updated_at
        FROM laboratory_labresult lr
        INNER JOIN laboratory_laborderitem li ON lr.order_item_id = li.id
        INNER JOIN laboratory_laborder lo ON li.lab_order_id = lo.id
        WHERE lo.facility_id = bucket.fac_id

  facility_invoices:
    # Billing invoices — facility-scoped
    parameters: SELECT token_parameters.facility_id AS fac_id
    data:
      - >
        SELECT
          id,
          invoice_number,
          organization_id,
          facility_id,
          patient_id,
          encounter_id,
          clinic_visit_id,
          status,
          payment_type,
          invoice_date,
          due_date,
          discount_type,
          discount_value,
          subtotal,
          tax_amount,
          discount_amount,
          discount_reason,
          total_amount,
          amount_paid,
          balance_due,
          insurance_provider,
          insurance_member_no,
          sha_claim_number,
          insurance_amount,
          insurance_coverage,
          notes,
          created_by_id,
          created_at,
          updated_at
        FROM billing_invoice
        WHERE facility_id = bucket.fac_id
