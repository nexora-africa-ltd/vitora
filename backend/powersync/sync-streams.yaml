# =============================================================================
# PowerSync Sync Streams for Vitora HMIS
# =============================================================================
# Defines what data syncs to each connected client using Sync Streams (v3).
# Data is scoped by facility_id / organization_id from JWT claims.
#
# SECURITY NOTES:
# - Encrypted fields (national_id, phone_number) are EXCLUDED from sync.
#   They remain API-only to comply with Kenya DPA 2019.
# - Sensitive patients (is_sensitive=true) require view_sensitive_patient
#   permission — handled at the API layer, not here.
# - Facility scoping ensures tenant isolation.
#
# Documentation: https://docs.powersync.com/sync/streams/overview
# =============================================================================

config:
  edition: 3

streams:
  # ───────────────────────────────────────────────────────────────────────────
  # Global reference data — synced to ALL authenticated users (read-only)
  # auto_subscribe: true → syncs automatically on connect (offline-first)
  # ───────────────────────────────────────────────────────────────────────────

  global_counties:
    # Kenya counties — 47 rows. Small, rarely changes.
    auto_subscribe: true
    priority: 2
    query: SELECT id, code, name FROM core_county

  global_subcounties:
    # Kenya sub-counties — ~289 rows. Small, rarely changes.
    auto_subscribe: true
    priority: 2
    query: SELECT id, county_id, name FROM core_subcounty

  global_wards:
    # Kenya wards — ~1448 rows. Exceeds 1000-row limit if combined.
    # Split into two batches by sub_county_id to stay under the limit.
    auto_subscribe: true
    priority: 3
    queries:
      - SELECT id, sub_county_id, name FROM core_ward WHERE id <= 750
      - SELECT id, sub_county_id, name FROM core_ward WHERE id > 750

  global_icd10_codes:
    # ICD-10 diagnosis codes — global reference data (~70k codes)
    # Synced once, queried locally for diagnosis search.
    auto_subscribe: true
    priority: 3
    query: >
      SELECT
        id,
        code,
        short_description,
        description,
        long_description,
        category,
        chapter,
        is_billable,
        is_active
      FROM encounters_icd10code
      WHERE is_active = true

  global_clinical_templates:
    # Clinical templates for treatment plans — global reference data
    auto_subscribe: true
    priority: 3
    query: >
      SELECT
        id,
        name,
        template_type,
        specialty,
        description,
        content,
        is_system,
        is_active,
        usage_count,
        created_by_id,
        created_at,
        updated_at
      FROM clinical_templates_clinicaltemplate
      WHERE is_active = true

  # ───────────────────────────────────────────────────────────────────────────
  # Organization-scoped data — synced to users in the same organization
  # ───────────────────────────────────────────────────────────────────────────

  # ───────────────────────────────────────────────────────────────────────────
  # Organization-scoped: patients + emergency contacts
  # Uses CTE so emergency contacts share bucket keys with patients,
  # avoiding a separate bucket per patient.
  # ───────────────────────────────────────────────────────────────────────────

  org_patient_data:
    auto_subscribe: true
    priority: 1
    with:
      org_pids: >
        SELECT id FROM patients_patient
        WHERE organization_id = auth.parameter('organization_id')
    queries:
      - >
        SELECT
          id,
          organization_id,
          registered_at_facility_id,
          mrn,
          first_name,
          middle_name,
          last_name,
          title,
          date_of_birth,
          gender,
          cr_number,
          sha_number,
          email,
          address,
          citizenship,
          identification_type,
          is_person_with_disability,
          is_sensitive,
          consent_given,
          consent_date,
          consent_deferred,
          registered_by_id,
          referral_source,
          referred_from_facility,
          county_id,
          sub_county_id,
          ward_id,
          is_deceased,
          created_at,
          updated_at
        FROM patients_patient
        WHERE id IN org_pids
      - >
        SELECT
          id,
          patient_id,
          full_name,
          relationship,
          phone_number,
          alternative_phone,
          created_at,
          updated_at
        FROM patients_emergencycontact
        WHERE patient_id IN org_pids

  # ───────────────────────────────────────────────────────────────────────────
  # Facility-scoped: encounters + triage (direct facility_id filter)
  # These have a direct facility_id column → 1 bucket each, no JOIN needed.
  # ───────────────────────────────────────────────────────────────────────────

  facility_encounters:
    auto_subscribe: true
    priority: 1
    query: >
      SELECT
        id,
        organization_id,
        facility_id,
        patient_id,
        clinic_visit_id,
        encounter_type,
        encounter_date,
        chief_complaint,
        temperature,
        pulse,
        blood_pressure,
        respiratory_rate,
        spo2,
        weight,
        height,
        notes,
        triage_requirement,
        status,
        triage_status,
        consultation_status,
        created_by_id,
        created_at,
        updated_at
      FROM encounters_encounter
      WHERE facility_id = auth.parameter('facility_id')

  facility_triage:
    auto_subscribe: true
    priority: 1
    query: >
      SELECT
        id,
        organization_id,
        facility_id,
        encounter_id,
        chief_complaint,
        chief_complaint_category,
        pain_score,
        mental_status,
        gcs_eye,
        gcs_verbal,
        gcs_motor,
        mobility,
        arrival_mode,
        referring_facility_name,
        allergies_noted,
        spo2,
        heart_rate,
        systolic_bp,
        diastolic_bp,
        temperature,
        respiratory_rate,
        weight,
        height,
        triage_category,
        auto_calculated_category,
        category_override_reason,
        assigned_area,
        assigned_clinic_id,
        assigned_clinician_id,
        arrival_time,
        triage_start_time,
        triage_end_time,
        seen_by_clinician_time,
        alerts,
        triaged_by_id,
        created_at,
        updated_at
      FROM triage_triageassessment
      WHERE facility_id = auth.parameter('facility_id')

  # ───────────────────────────────────────────────────────────────────────────
  # Facility clinical: diagnoses + treatment plans + medications
  # Consolidated into ONE stream with a shared encounter CTE.
  # Diagnoses and treatment plans share the same bucket keys (encounter IDs),
  # saving ~E duplicate buckets vs separate streams.
  # ───────────────────────────────────────────────────────────────────────────

  facility_clinical:
    auto_subscribe: true
    priority: 1
    with:
      fac_enc_ids: >
        SELECT id FROM encounters_encounter
        WHERE facility_id = auth.parameter('facility_id')
      fac_tp_ids: >
        SELECT tp.id FROM encounters_treatmentplan tp
        WHERE tp.encounter_id IN (
          SELECT id FROM encounters_encounter
          WHERE facility_id = auth.parameter('facility_id')
        )
    queries:
      # Diagnoses — keyed by encounter (shares fac_enc_ids)
      - >
        SELECT
          id,
          encounter_id,
          icd10_code_id,
          icd11_code,
          icd11_display,
          snomed_code,
          snomed_display,
          diagnosis_type,
          free_text_diagnosis,
          notes,
          is_confirmed,
          certainty,
          diagnosed_by_id,
          diagnosed_at,
          created_at,
          updated_at
        FROM encounters_diagnosis
        WHERE encounter_id IN fac_enc_ids
      # Treatment plans — keyed by encounter (shares fac_enc_ids)
      - >
        SELECT
          id,
          encounter_id,
          template_id,
          medications_json,
          procedures_json,
          clinical_notes,
          follow_up_instructions,
          follow_up_date,
          diet_recommendations,
          activity_restrictions,
          referral_needed,
          referral_specialty,
          referral_notes,
          status,
          created_by_id,
          approved_by_id,
          created_at,
          updated_at
        FROM encounters_treatmentplan
        WHERE encounter_id IN fac_enc_ids
      # Medications — keyed by treatment plan (separate CTE)
      - >
        SELECT
          id,
          treatment_plan_id,
          name,
          dosage,
          frequency,
          duration,
          route,
          quantity,
          instructions,
          start_date,
          end_date,
          created_at,
          updated_at
        FROM encounters_medication
        WHERE treatment_plan_id IN fac_tp_ids

  # ───────────────────────────────────────────────────────────────────────────
  # Facility pharmacy: prescriptions + line items
  # Consolidated with shared CTE for prescription IDs.
  # ───────────────────────────────────────────────────────────────────────────

  facility_pharmacy:
    auto_subscribe: true
    priority: 1
    with:
      fac_rx_ids: >
        SELECT id FROM pharmacy_prescription
        WHERE facility_id = auth.parameter('facility_id')
    queries:
      - >
        SELECT
          id,
          prescription_number,
          organization_id,
          facility_id,
          encounter_id,
          admission_id,
          patient_id,
          prescribed_by_id,
          prescribed_at,
          valid_until,
          status,
          dispensing_type,
          is_discharge_medication,
          clinical_notes,
          created_at,
          updated_at
        FROM pharmacy_prescription
        WHERE id IN fac_rx_ids
      - >
        SELECT
          id,
          prescription_id,
          drug_id,
          quantity,
          dosage,
          frequency,
          duration,
          route,
          instructions,
          quantity_dispensed,
          is_substitutable,
          is_cancelled,
          cancellation_reason,
          created_at,
          updated_at
        FROM pharmacy_prescriptionitem
        WHERE prescription_id IN fac_rx_ids

  # ───────────────────────────────────────────────────────────────────────────
  # Facility laboratory: orders + items + results
  # Consolidated with shared CTEs for order and item IDs.
  # ───────────────────────────────────────────────────────────────────────────

  facility_laboratory:
    auto_subscribe: true
    priority: 1
    with:
      fac_lo_ids: >
        SELECT id FROM laboratory_laborder
        WHERE facility_id = auth.parameter('facility_id')
      fac_loi_ids: >
        SELECT li.id FROM laboratory_laborderitem li
        WHERE li.lab_order_id IN (
          SELECT id FROM laboratory_laborder
          WHERE facility_id = auth.parameter('facility_id')
        )
    queries:
      - >
        SELECT
          id,
          order_number,
          organization_id,
          facility_id,
          patient_id,
          encounter_id,
          admission_id,
          ordered_by_id,
          order_type,
          priority,
          clinical_notes,
          status,
          status_changed_at,
          status_changed_by_id,
          specimen_collected,
          specimen_collected_at,
          specimen_collected_by_id,
          sample_type,
          total_cost,
          is_paid,
          ordered_at,
          completed_at,
          created_at,
          updated_at
        FROM laboratory_laborder
        WHERE id IN fac_lo_ids
      - >
        SELECT
          id,
          lab_order_id,
          test_id,
          status,
          unit_cost,
          special_instructions,
          created_at,
          updated_at
        FROM laboratory_laborderitem
        WHERE lab_order_id IN fac_lo_ids
      - >
        SELECT
          id,
          order_item_id,
          specimen_id,
          numeric_value,
          text_value,
          option_value,
          result_unit,
          reference_low,
          reference_high,
          reference_range_text,
          result_flag,
          interpretation,
          is_critical_result,
          method,
          equipment,
          verification_status,
          verified_by_id,
          verified_at,
          entered_by_id,
          entered_at,
          is_amended,
          amendment_reason,
          original_value,
          amended_by_id,
          amended_at,
          is_external_result,
          external_result_date,
          created_at,
          updated_at
        FROM laboratory_labresult
        WHERE order_item_id IN fac_loi_ids

  # ───────────────────────────────────────────────────────────────────────────
  # Facility billing: invoices (direct facility_id filter → 1 bucket)
  # ───────────────────────────────────────────────────────────────────────────

  facility_invoices:
    auto_subscribe: true
    priority: 1
    query: >
      SELECT
        id,
        invoice_number,
        organization_id,
        facility_id,
        patient_id,
        encounter_id,
        clinic_visit_id,
        status,
        payment_type,
        invoice_date,
        due_date,
        discount_type,
        discount_value,
        subtotal,
        tax_amount,
        discount_amount,
        discount_reason,
        total_amount,
        amount_paid,
        balance_due,
        insurance_provider,
        insurance_member_no,
        sha_claim_number,
        insurance_amount,
        insurance_coverage,
        notes,
        created_by_id,
        created_at,
        updated_at
      FROM billing_invoice
      WHERE facility_id = auth.parameter('facility_id')
