[tool.poetry]
name = "vitora-hmis"
version = "0.1.0"
description = "Vitora HMIS - Offline-first Hospital Management Information System for Kenya"
authors = ["Nexora Africa Ltd <dev@nexora.africa>"]
readme = "README.md"
packages = [{include = "hmis"}]

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.0"
djangorestframework = "^3.14"
djangorestframework-simplejwt = "^5.3"
django-cors-headers = "^4.3"
django-filter = "^23.5"
psycopg2-binary = "^2.9"
celery = {extras = ["redis"], version = "^5.3"}
requests = "^2.31"
python-dotenv = "^1.0"
pydantic = "^2.5"
pydantic-settings = "^2.1"
cryptography = "^42.0"
pillow = "^10.2"
django-extensions = "^3.2"
reportlab = "^4.4.7"
num2words = "^0.5.14"
openpyxl = "^3.1.5"
pyjwt = "^2.10.1"
pydotenv = "^0.0.7"
crypto = "^1.4.1"
pycryptodome = "^3.23.0"
dj-database-url = "^3.1.0"
gunicorn = "^23.0.0"
whitenoise = "^6.11.0"
qrcode = {extras = ["pil"], version = "^8.2"}
drf-nested-routers = "^0.95.0"
channels = "^4.3.2"
channels-redis = "^4.3.0"
daphne = "^4.2.1"
pytest-asyncio = "^0.23"
cloc = "^0.2.5"
pycloc = "^0.0.1a0"
fhir-resources = "^8.1.0"
hl7apy = "^1.3.4"
django-oauth-toolkit = "^3.2.0"
pydicom = "^3.0.1"
pynetdicom = "^3.0.4"
numpy = "^2.4.2"
drf-spectacular = "^0.29.0"
africastalking = "^2.0.2"
twisted = {extras = ["http2", "tls"], version = "^25.5.0"}
django-otp = "^1.7.0"
pyotp = "^2.9.0"
django-simple-history = "^3.11.0"

# Azure KMS (optional - for production with Azure Key Vault)
azure-identity = {version = "^1.21.0", optional = true}
azure-keyvault-keys = {version = "^4.10.0", optional = true}
ruff = "^0.15.4"
django-ratelimit = "^4.1.0"
resend = "^2.26.0"

[tool.poetry.extras]
azure = ["azure-identity", "azure-keyvault-keys"]

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^7.4"
pytest-django = "^4.7"
pytest-cov = "^4.1"
pytest-xdist = "^3.5"
pytest-mock = "^3.12"
faker = "^22.0"
factory-boy = "^3.3"

# Linting & Formatting
ruff = "^0.15.4"
black = "^23.12"
isort = "^5.13"

# Type Checking
mypy = "^1.8"
django-stubs = "^4.2"
djangorestframework-stubs = "^3.14"
types-python-dateutil = "^2.8"

# Security
bandit = {extras = ["toml"], version = "^1.7"}

# Documentation
sphinx = "^7.2"
sphinx-rtd-theme = "^2.0"

# Development Tools
ipython = "^8.20"
ipdb = "^0.13"
pre-commit = "^4.5.1"
pdfplumber = "^0.11.8"
flask = "^3.1.2"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "hmis.settings.test"
python_files = ["test_*.py", "*_test.py", "tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]
# Ignore Django model classes that match Test* pattern (e.g., TestCatalog)
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
    # Africa's Talking SDK emits this during initialization regardless of usage
    "ignore:Sandbox is currently not available for the Whatsapp service:UserWarning",
]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--no-migrations",
    "--ignore=tests/integration",
]
# Coverage is NOT in addopts — use `make test` or pass --cov=hmis explicitly.
# This keeps `poetry run pytest tests/foo/ -x` fast for development.
# --no-migrations creates tables from models directly (skips 252 migration
# files), dropping setup time from ~165s to ~2s.  CI (`make test`) overrides
# with --migrations to verify data-migration correctness.
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "fhir_integration: Tests requiring HAPI FHIR server",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["hmis"]
omit = [
    "*/migrations/*",
    "*/management/*",
    "*/management/commands/*",
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
    "wsgi.py",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 100
target-version = "py312"
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "S",      # flake8-bandit (security)
    "T20",    # flake8-print
    "DJ",     # flake8-django
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "S101",   # use of assert (ok in tests)
    "DJ001",  # avoid nullable CharField (sometimes needed)
]
exclude = [
    ".git",
    "__pycache__",
    "*/migrations/*",
    "venv",
    "env",
    ".venv",
    ".env",
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101", "S105", "S106", "S108", "ARG", "F401", "F841", "SIM105", "SIM117", "T201", "B007", "B017", "UP038", "E712"]
"**/tests/**" = ["S101", "S105", "S106", "S108", "ARG", "F401", "F841", "SIM105", "SIM117", "T201", "B007", "B017", "UP038", "E712"]
"hmis/apps/*/admin.py" = ["ARG002"]  # Django admin methods require these signatures
"hmis/apps/*/views.py" = ["ARG002"]  # Django view methods require these signatures
"hmis/apps/*/sha_views.py" = ["ARG002", "E402", "F401"]  # DRF view methods may have unused args, late imports for optional deps
"hmis/apps/core/views.py" = ["E402"]  # Late imports for optional features
"hmis/apps/core/permissions.py" = ["ARG002", "S110"]  # DRF permission methods require these signatures, try-except-pass ok for permission checks
"hmis/apps/*/signals.py" = ["ARG001"]  # Django signal handlers require these signatures
"hmis/apps/core/management/commands/*.py" = ["ARG002"]  # Management command methods require these signatures
"hmis/apps/*/management/commands/*.py" = ["ARG002"]  # Management command methods require these signatures
"hmis/urls.py" = ["ARG001"]  # View functions may require request argument
"hmis/celery.py" = ["T201"]  # Print is acceptable in celery debug
"hmis/apps/billing/services/*.py" = ["ARG002", "B904", "S110", "SIM102", "SIM108"]  # Service methods may have unused params for API compatibility, exception chaining not always needed
"hmis/apps/billing/renderers.py" = ["ARG002", "UP038"]  # DRF renderer methods require these signatures
"hmis/apps/billing/sha_serializers.py" = ["SIM102"]  # Nested if for readability
"hmis/apps/inpatient/models.py" = ["ARG002", "ARG001", "E402", "SIM102", "SIM108"]  # Model methods may have unused args, late imports for signals
"hmis/apps/inpatient/serializers.py" = ["SIM105"]  # try-except-pass acceptable for optional conversions
"hmis/apps/laboratory/services/*.py" = ["ARG002", "E722"]  # Service methods may have unused params, bare except acceptable for notifications
"hmis/apps/laboratory/models.py" = ["DJ012"]  # Model method ordering is acceptable
"hmis/apps/laboratory/signals.py" = ["SIM102"]  # Nested if for readability
"hmis/apps/pharmacy/models.py" = ["ARG002", "DJ012"]  # Model methods may have unused args, method ordering acceptable
"hmis/apps/triage/models.py" = ["SIM102"]  # Nested if for readability
"hmis/apps/triage/serializers.py" = ["SIM102", "B904"]  # Nested if for readability, exception chaining not needed
"hmis/apps/clinical_templates/models.py" = ["DJ012"]  # Model method ordering is acceptable
"hmis/apps/clinical_templates/schemas.py" = ["SIM102"]  # Nested if for readability
"hmis/apps/clinical_templates/serializers.py" = ["SIM102"]  # Nested if for readability
"hmis/apps/encounters/models.py" = ["DJ012", "SIM102", "B904"]  # Model method ordering acceptable, nested if for readability
"hmis/apps/core/models.py" = ["ARG002"]  # Model methods may have unused args for future use
"hmis/apps/core/utils.py" = ["ARG001"]  # Function params may be unused for API consistency
"hmis/apps/core/management/commands/seed_demo_data.py" = ["S311", "B007"]  # Demo data seeding uses random for non-security purposes
"hmis/settings/development.py" = ["F405"]  # Star imports from base settings are intentional
"scripts/*.py" = ["T201", "S311", "S104", "S303", "ARG001", "SIM102"]  # Scripts use print, mock servers use insecure random, bind to all interfaces
"hmis/apps/core/fixtures/*.py" = ["T201", "E402", "SIM108", "S303"]  # Fixture scripts use print, late imports, may use insecure hashes for compatibility

[tool.ruff.isort]
known-first-party = ["hmis"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["*/migrations/*"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false  # Set to true once codebase is typed
ignore_missing_imports = true
check_untyped_defs = false
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
warn_unreachable = false
strict_optional = true
no_implicit_optional = false

# Exclude highly dynamic codepaths from type-checking (settings, fixtures, commands)
exclude = "(?x)(^|/)(hmis/settings/|hmis/apps/core/fixtures/|hmis/apps/[^/]+/management/commands/)"

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "hmis.settings.development"

[tool.bandit]
exclude_dirs = [
    "tests",
    "*/tests/*",
    "*/migrations/*",
    "hmis/apps/core/fixtures",
    "hmis/apps/*/management/commands",
    "hmis/apps/core/management/commands",
    "backend/hmis/apps/core/fixtures",
    "backend/hmis/apps/*/management/commands",
    "backend/hmis/apps/core/management/commands",
]
skips = ["B101"]  # Skip assert_used in tests

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
