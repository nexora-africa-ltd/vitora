[tool.poetry]
name = "vitora-hmis"
version = "0.1.0"
description = "Vitora HMIS - Offline-first Hospital Management Information System for Kenya"
authors = ["Nexora Africa Ltd <dev@nexora.africa>"]
readme = "README.md"
packages = [{include = "hmis"}]

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.0"
djangorestframework = "^3.14"
djangorestframework-simplejwt = "^5.3"
django-cors-headers = "^4.3"
django-filter = "^23.5"
psycopg2-binary = "^2.9"
celery = {extras = ["redis"], version = "^5.3"}
requests = "^2.31"
python-dotenv = "^1.0"
pydantic = "^2.5"
pydantic-settings = "^2.1"
cryptography = "^42.0"
pillow = "^10.2"
django-extensions = "^3.2"

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^7.4"
pytest-django = "^4.7"
pytest-cov = "^4.1"
pytest-xdist = "^3.5"
pytest-mock = "^3.12"
faker = "^22.0"
factory-boy = "^3.3"

# Linting & Formatting
ruff = "^0.1"
black = "^23.12"
isort = "^5.13"

# Type Checking
mypy = "^1.8"
django-stubs = "^4.2"
djangorestframework-stubs = "^3.14"
types-python-dateutil = "^2.8"

# Security
bandit = {extras = ["toml"], version = "^1.7"}

# Documentation
sphinx = "^7.2"
sphinx-rtd-theme = "^2.0"

# Development Tools
ipython = "^8.20"
ipdb = "^0.13"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "hmis.settings"
python_files = ["test_*.py", "*_test.py", "tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--cov=hmis",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=80",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["hmis"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 100
target-version = "py312"
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "S",      # flake8-bandit (security)
    "T20",    # flake8-print
    "DJ",     # flake8-django
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "S101",   # use of assert (ok in tests)
    "DJ001",  # avoid nullable CharField (sometimes needed)
]
exclude = [
    ".git",
    "__pycache__",
    "*/migrations/*",
    "venv",
    "env",
    ".venv",
    ".env",
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101", "ARG"]
"**/tests/**" = ["S101", "ARG"]

[tool.ruff.isort]
known-first-party = ["hmis"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["*/migrations/*"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Set to true once codebase is typed
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_optional = true

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "hmis.settings.development"

[tool.bandit]
exclude_dirs = ["tests", "*/tests/*", "*/migrations/*"]
skips = ["B101"]  # Skip assert_used in tests

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
