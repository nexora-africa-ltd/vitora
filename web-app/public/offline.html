<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4e0b18" />
    <title>Vitora HMIS Offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(21, 96, 115, 0.18), transparent 38%),
          linear-gradient(160deg, #f8f5f2 0%, #fffdfb 45%, #f4f7f8 100%);
        color: #1f2937;
      }

      main {
        width: min(32rem, calc(100vw - 2rem));
        padding: 2rem;
        border: 1px solid rgba(78, 11, 24, 0.12);
        border-radius: 1.5rem;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 18px 60px rgba(78, 11, 24, 0.12);
      }

      .eyebrow {
        margin: 0 0 0.75rem;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #4e0b18;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.75rem, 4vw, 2.4rem);
        line-height: 1.05;
      }

      p {
        margin: 1rem 0 0;
        line-height: 1.6;
        color: #475569;
      }

      strong {
        color: #0f172a;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Vitora HMIS</p>
      <h1>You are offline.</h1>
      <p><strong>Static app assets remain available,</strong> but live clinical data and authenticated pages require a network connection.</p>
      <p>Reconnect to continue working in the full hospital workspace.</p>
    </main>
  </body>
</html>
