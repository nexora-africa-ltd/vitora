# Pre-commit hooks for Vitora HMIS
# Matches the "All Quality Checks (Pre-commit)" section in backend/README.md.
#
# Install once:
#   cd backend && poetry install
#   ./scripts/setup-git-hooks.sh
#
# Note: This repo uses versioned hooks in .githooks via core.hooksPath
# (instead of `pre-commit install`), so the hook is shared consistently.
#
# Run manually:
#   poetry run pre-commit run --all-files

repos:
  # Basic hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-yaml

  # Python: Ruff (lint + import rules)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/.*\.py$
      - id: ruff-format
        files: ^backend/.*\.py$

  # Python: Black
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        stages: [manual]
        files: ^backend/.*\.py$

  # Python: isort
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        files: ^backend/.*\.py$

  # Python: mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        files: ^backend/hmis/.*\.py$
        args: [--config-file, backend/pyproject.toml]
        stages: [manual]
        additional_dependencies:
          # Stubs
          - django-stubs
          - djangorestframework-stubs
          - types-python-dateutil
          # Runtime deps required for django-stubs plugin initialization
          - Django>=5.0,<6.0
          - djangorestframework>=3.14
          - djangorestframework-simplejwt>=5.3
          - django-cors-headers>=4.3
          - django-filter>=23.5
          - django-extensions>=3.2
          - celery>=5.3
          - requests>=2.31
          - python-dotenv>=1.0
          - pydantic>=2.5
          - pydantic-settings>=2.1
          - cryptography>=42.0
          - pillow>=10.2
          - reportlab>=4.4
          - num2words>=0.5
          - openpyxl>=3.1
          - pyjwt>=2.10
          - dj-database-url>=3.1
          - whitenoise>=6.11

  # Python: bandit security scan
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: [-r, backend/hmis, -c, backend/pyproject.toml]
        files: ^backend/.*\.py$
        pass_filenames: false
        additional_dependencies:
          - bandit[toml]

  # Python: tests + coverage on push (keeps commit fast but blocks bad pushes)
  - repo: local
    hooks:
      - id: backend-pytest-cov
        name: backend pytest + coverage (>=80%)
        entry: bash -lc 'cd backend && poetry run pytest --cov=hmis --cov-fail-under=80'
        language: system
        pass_filenames: false
        stages: [manual]
